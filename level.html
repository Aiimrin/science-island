<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>闯关模式 - 科学闯关岛</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Microsoft YaHei','SimHei','PingFang SC','Noto Sans SC',sans-serif;
  background:#fef9f0;min-height:100vh;color:#4a3020;
  -webkit-font-smoothing:antialiased;
}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fffdf6;border-bottom:3px solid #c8b898;position:sticky;top:0;z-index:10}
.back-btn{width:40px;height:40px;border:2px solid #c8b898;background:#fdf6ed;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(120,90,50,.12);color:#4a3020}
.unit-info{flex:1}.unit-name{font-size:22px;font-weight:700}.unit-desc{font-size:13px;color:#8a7060}
.progress-wrap{padding:12px 16px;background:#fdf6ed;border-bottom:2px solid rgba(0,0,0,.04)}
.progress-bar{height:10px;background:#e8dcc8;border:2px solid rgba(0,0,0,.06)}
.progress-fill{height:100%;transition:width .3s;background:#e0b860}
.progress-text{font-size:13px;color:#8a7060;margin-top:4px;text-align:right}
.main{max-width:700px;margin:0 auto;padding:16px}
/* 卡片 */
.card{background:#fffdf8;border:3px solid #d8c8a8;padding:20px;margin-bottom:16px;box-shadow:3px 3px 0 rgba(120,90,50,.1)}
.card-title{font-size:20px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:10px;height:10px;display:inline-block;border:2px solid rgba(0,0,0,.15)}
.card-text{font-size:15px;line-height:2;color:#5a4030;margin-bottom:12px}
.card-key{background:#fef5e8;border:2px solid rgba(0,0,0,.05);padding:12px 14px;font-size:14px;line-height:1.8;color:#6a5040}
.card-key strong{color:#c08030}
.tip-box{background:#f0f8e8;border:2px solid #a0c878;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.7;color:#407020}
.tip-box::before{content:'💡 记忆技巧：';font-weight:700}
/* 题目 */
.quiz{background:#fffdf8;border:3px solid #c8b898;padding:20px;margin-bottom:16px;box-shadow:3px 3px 0 rgba(120,90,50,.1)}
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.quiz-num{font-size:14px;color:#8a7060}.quiz-combo{font-size:14px;color:#e08030;font-weight:700;opacity:0;transition:opacity .3s}
.quiz-combo.on{opacity:1}
.quiz-q{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.6}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:12px 16px;border:2px solid #d8c8a8;background:#fdf6ed;font-size:16px;cursor:pointer;text-align:left;transition:all .1s;font-family:inherit;color:#4a3020}
.quiz-opt:hover{background:#fef5e0;border-color:#c8a860}
.quiz-opt:active{transform:scale(.98)}
.quiz-opt.chosen{pointer-events:none}
.quiz-opt.correct{background:#c8e8b0!important;border-color:#78a848!important;color:#386020!important}
.quiz-opt.wrong{background:#f0c8b8!important;border-color:#c87858!important;color:#803020!important}
.feedback{padding:12px 14px;margin-top:12px;font-size:15px;font-weight:700;display:none;border-radius:4px}
.fb-ok{display:block;background:#e0f0d0;border:2px solid #90c060;color:#407020}
.fb-no{display:block;background:#f8e0d0;border:2px solid #d89870;color:#803020}
.next-btn{display:none;margin-top:12px;text-align:center}
.next-btn.show{display:block}
.btn{padding:12px 28px;border:2px solid #c8b898;background:#e0b860;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 rgba(120,90,50,.15);transition:all .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(120,90,50,.2)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(120,90,50,.15)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn.secondary{background:#fdf6ed;color:#4a3020}
/* 结果 */
.result{text-align:center;padding:40px 20px}
.result-icon{font-size:72px;margin-bottom:12px}
.result-title{font-size:28px;font-weight:700;margin-bottom:8px}
.result-score{font-size:18px;color:#8a7060;margin-bottom:16px}
.result-stars{font-size:48px;letter-spacing:4px;margin-bottom:24px}
/* 浮窗 */
.float-combo{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;pointer-events:none;opacity:0;z-index:200;color:#e08030;text-shadow:2px 2px 0 rgba(0,0,0,.1)}
.float-combo.pop{animation:popIn .8s ease-out forwards}
@keyframes popIn{0%{opacity:1;transform:translate(-50%,-50%) scale(.5)}50%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-100%) scale(1)}}
</style>
</head>

<audio id="bgm" src="Spring_Wild_Horseradish_Jam.mp3" autoplay loop volume="0.18"></audio>

  <button class="back-btn" onclick="history.back()">←</button>
  <div class="unit-info"><div class="unit-name" id="uname">---</div><div class="unit-desc" id="udesc">---</div></div>
</div>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
  <div class="progress-text" id="ptext">0 / 0 课</div>
</div>
<div class="main" id="main"></div>
<div class="float-combo" id="fcombo"></div>

<script>
// ==================== 题库（每单元15-25题） ====================
const Q={
s4a1:[
  {q:'生物学家根据什么特征将动物分为脊椎动物和无脊椎动物？',o:['生活环境','运动方式','有无脊椎','外形颜色'],a:2,t:0,e:'【知识点】动物分类的主要依据：生物学家根据动物体内有无脊椎，将其分为脊椎动物和无脊椎动物两大类。【选项分析】A. 生活环境——有些动物生活环境相同但属于不同类别，不能作为主要分类标准。B. 运动方式——同样，运动方式相同的动物不一定属于同一类。C. 有无脊椎——正确，这是最核心的分类依据。D. 外形颜色——外形和颜色差异太大且不科学。'},
  {q:'下列属于无脊椎动物的是？',o:['青蛙','蜗牛','鲨鱼','朱鹮'],a:1,t:0,e:'【知识点】无脊椎动物指体内没有脊椎骨的动物，常见的有蜗牛、蚊虫、水母、蚯蚓等。【选项分析】A. 青蛙——有脊椎，属于脊椎动物中的两栖类。B. 蜗牛——正确，体内无脊椎，属于无脊椎动物中的软体动物。C. 鲨鱼——有脊椎，属于脊椎动物中的鱼类。D. 朱鹮——有脊椎，属于脊椎动物中的鸟类。'},
  {q:'下列属于脊椎动物的是？',o:['蚊虫','水母','蚯蚓','猴子'],a:3,t:0,e:'【知识点】脊椎动物体内有脊椎骨组成的脊柱，起支撑身体的关键作用。猴子有脊椎，属于哺乳类脊椎动物。【选项分析】A. 蚊虫——节肢动物，无脊椎。B. 水母——腔肠动物，无脊椎。C. 蚯蚓——环节动物，无脊椎。D. 猴子——正确，哺乳类，有脊椎。'},
  {q:'脊椎的作用不包括？',o:['支撑身体','保护内脏','负重减震','提供营养'],a:3,t:0,e:'【知识点】脊椎有三大功能：支撑身体、保护内脏、负重和减震。它不负责提供营养——那是消化系统的工作。【选项分析】A. 支撑身体——是脊椎的核心功能。B. 保护内脏——脊椎包裹并保护着脊髓。C. 负重减震——一节一节的脊椎结构能缓冲运动中的冲击力。D. 提供营养——错误，脊椎是骨骼，不参与营养供给。'},
  {q:'脊椎的结构特点是？',o:['一整根骨头','一节一节的','两块拼成的','软管状的'],a:1,t:0,e:'【知识点】脊椎由多块椎骨一节一节连接而成，这种结构使脊椎可以弯曲，让身体在一定范围内灵活运动。【选项分析】A. 一整根骨头——错误，如果是一整根就无法弯腰了。B. 一节一节的——正确，椎骨逐节相连，兼具支撑和灵活性。C/D——不符合脊椎的实际结构。'},
  {q:'我国闻名世界的珍稀动物不包括？',o:['大熊猫','扬子鳄','东北虎','北极熊'],a:3,t:0,e:'【知识点】我国是世界上拥有野生动物种类最多的国家之一，大熊猫、扬子鳄、东北虎、金丝猴、朱鹮等都是我国闻名世界的珍稀动物。北极熊主要生活在北极地区。【选项分析】A/B/C——均是我国珍稀动物。D. 北极熊——正确（不符合题意），北极熊生活在北极圈附近，不是中国的特色珍稀动物。'},
  {q:'鱼类用什么器官呼吸？',o:['肺','鳃','皮肤','气管'],a:1,t:1,e:'【知识点】鱼类用鳃呼吸。水流从口进入，经过鳃丝时进行气体交换（吸收氧气、排出二氧化碳），再从鳃盖下方流出。鳃是鱼类区别于其他动物的本质特征之一。【选项分析】A. 肺——哺乳动物（如鲸）用肺，但鲸不是鱼。B. 鳃——正确。C. 皮肤——两栖动物（如青蛙）可以辅助皮肤呼吸，但不是鱼类的主要呼吸方式。D. 气管——昆虫的呼吸器官。'},
  {q:'鱼类用什么器官运动？',o:['足','翅膀','鳍','尾巴'],a:2,t:1,e:'【知识点】鱼类用鳍来运动，包括胸鳍、腹鳍、背鳍、臀鳍和尾鳍。各鳍分工合作：尾鳍提供前进动力，胸鳍配合尾鳍决定方向。【选项分析】A/C/D——尾巴不是专业术语，科学的表述是"鳍"。'},
  {q:'鱼在游动时提供主要动力的是？',o:['胸鳍','腹鳍','尾鳍','背鳍'],a:2,t:1,e:'【知识点】鱼在游动时各鳍各有分工。尾鳍摆动产生主要的前进动力，胸鳍和尾鳍配合负责转向。背鳍和臀鳍主要起保持身体平衡的作用。【选项分析】A/B——胸鳍和腹鳍主要辅助转向和平衡。C. 尾鳍——正确，主要动力来源。D. 背鳍——保持身体平衡。'},
  {q:'鱼类属于什么类型的动物？',o:['恒温脊椎动物','变温脊椎动物','恒温无脊椎动物','变温无脊椎动物'],a:1,t:1,e:'【知识点】鱼类是变温脊椎动物。变温意味着体温随环境温度变化；脊椎动物意味着体内有脊椎骨。恒温动物（如鸟类和哺乳类）能自己维持体温不变。【选项分析】A. 恒温脊椎——鱼类不能维持恒定体温。B. 变温脊椎——正确。C/D——鱼类有脊椎，不是无脊椎动物。'},
  {q:'鱼鳃的作用是？',o:['吸收营养','进行气体交换','提供动力','保持平衡'],a:1,t:1,e:'【知识点】鳃是鱼类的呼吸器官，作用是完成气体交换——从水中吸收氧气并排出二氧化碳。水流经过鳃丝时，毛细血管完成氧气和二氧化碳的交换。【选项分析】A——吸收营养是消化系统（肠道）的工作。B——正确。C/D——动力和平衡由鳍负责。'},
  {q:'鸟类的共同特征是什么？',o:['会飞','体表有羽毛','生活在地上','吃虫子'],a:1,t:2,e:'【知识点】所有鸟类的共同特征是体表有羽毛，而不是会飞。鸵鸟、企鹅也是鸟类，它们不会飞但体表同样有羽毛。鸟类的三个本质特征是：体表有羽毛、恒温、卵生。【选项分析】A. 会飞——鸵鸟和企鹅不会飞但属于鸟类。B. 体表有羽毛——正确。C/D——不符合事实。'},
  {q:'下列哪项不是鸟类的特征？',o:['体表有羽毛','恒温','胎生','卵生'],a:2,t:2,e:'【知识点】鸟类三个核心特征：体表有羽毛、恒温、卵生。胎生是哺乳动物的特征（如人、狗、鲸），鸟类是卵生的（下蛋孵化）。【选项分析】A/B/D——都是鸟类的特征。C. 胎生——正确（不是鸟类的特征），鸟类下蛋，是卵生。'},
  {q:'正羽的主要作用是？',o:['保温和防水','防水和飞行','保温和美观','产热和保暖'],a:1,t:2,e:'【知识点】羽毛分为正羽和绒羽：正羽是覆盖在身体外面的大型羽片，排列成扇形，主要作用是防水和帮助飞行；绒羽紧贴身体、细小柔软，主要作用是保温。正羽管中间是空的，可以减轻重量。【选项分析】A——保温是绒羽的工作，不是正羽的。B——正确，正羽既防水（滴水会滑落）又有助于飞行。C/D——不准确。'},
  {q:'绒羽的主要作用是？',o:['飞行','防水','保温','吸引异性'],a:2,t:2,e:'【知识点】绒羽紧贴鸟的身体，像棉花一样蓬松，细小而柔软。它的主要作用是保持体温（保温），就像人穿的羽绒服一样。【选项分析】A. 飞行——正羽负责飞行。B. 防水——正羽负责防水。C. 保温——正确。D. 吸引异性——部分鸟类有漂亮的羽毛来吸引配偶，但这不是绒羽的主要功能。'},
  {q:'在正羽上滴水，水会滑落，说明正羽有什么作用？',o:['保温','防水','助飞','以上都是'],a:1,t:2,e:'【知识点】正羽具有防水性。实验中，在正羽上滴水后水不会浸入而是滑落，这说明正羽可以抵挡雨水，在飞行时不被小雨打湿翅膀。【选项分析】水滴滑落证明的是防水性，与保温和助飞无关。'},
  {q:'剪断正羽后发现羽管中间是空的，这是为了？',o:['减轻重量','储存空气','防水','保温'],a:0,t:2,e:'【知识点】正羽管中间是空心的。这是鸟类的进化适应——空心结构可以大大减轻羽毛的整体重量，从而减轻飞行负担。同时空心结构也具有一定的强度和韧性。【选项分析】空心=减轻重量，这是鸟类适应飞行的关键设计。'},
  {q:'哺乳动物不具备哪个特征？',o:['体表有毛','恒温','卵生','哺乳'],a:2,t:3,e:'【知识点】哺乳动物的核心特征：体表有毛、恒温、胎生（少数例外如鸭嘴兽）、哺乳（用乳汁喂养后代）。【选项分析】A/B/D——都是哺乳动物的特征。C. 卵生——正确（哺乳动物不具备），绝大多数哺乳动物是胎生的。注意：鸭嘴兽是卵生的哺乳动物，但它是特例。'},
  {q:'鲸鱼属于？',o:['鱼类','哺乳类','爬行类','两栖类'],a:1,t:3,e:'【知识点】鲸鱼虽然生活在水中，外形像鱼，但它具备哺乳动物的所有典型特征：用肺呼吸、恒温、胎生、哺乳（鲸鱼妈妈会分泌乳汁喂养小鲸）。所以它是哺乳类，不是鱼类。【选项分析】判定动物的类别不能只看生活环境，要看本质特征。'},
  {q:'哺乳动物皮下脂肪的主要作用是？',o:['储存能量和保温','提供营养','保护内脏','辅助运动'],a:0,t:3,e:'【知识点】哺乳动物皮下脂肪有两大功能：①保温——脂肪层像"棉被"隔绝寒冷（实验中包裹脂肪的手指放入冰水感觉没那么冷）；②提供能量——在食物短缺时可以消耗脂肪维持生命。【选项分析】B/C/D——都不是脂肪的主要作用。'},
  {q:'朱鹮属于我国的？',o:['常见鸟类','珍稀脊椎动物','珍稀无脊椎动物','外来物种'],a:1,t:4,e:'【知识点】朱鹮是国家一级保护动物，属于珍稀脊椎动物（体内有脊椎）。我国拥有大熊猫、金丝猴、扬子鳄、东北虎、朱鹮等几百种闻名世界的珍稀动物。【选项分析】A. 常见鸟类——朱鹮非常稀有。B. 珍稀脊椎动物——正确。C. 珍稀无脊椎动物——朱鹮是鸟，有脊椎。D. 外来物种——朱鹮是中国的本土珍稀鸟类。'},
  {q:'以下哪种是我国的珍稀动物？',o:['大熊猫','猫','狗','鸡'],a:0,t:4,e:'【知识点】大熊猫是中国的"国宝"，属于国家一级保护动物，也是世界闻名的珍稀动物。它主要生活在四川、陕西和甘肃的山区。【选项分析】B/C/D——都是常见的家养动物，不属于珍稀动物。'},
  {q:'《野生动物保护法》的目的是？',o:['捕猎野生动物','保护野生动物','饲养野生动物','研究野生动物'],a:1,t:4,e:'【知识点】我国颁布《中华人民共和国野生动物保护法》，目的是保护野生动物及其栖息环境，禁止非法捕猎和交易。这体现了国家对生物多样性保护的重视。【选项分析】法律名称本身就说明了其目的——"保护"。'},
  {q:'下列不属于珍稀脊椎动物的是？',o:['朱鹮','大熊猫','东北虎','蜘蛛'],a:3,t:4,e:'【知识点】珍稀脊椎动物指的是数量稀少、体内有脊椎的保护动物。朱鹮、大熊猫、东北虎都有脊椎。蜘蛛属于节肢动物，体内没有脊椎，是无脊椎动物，也不属于珍稀保护动物的范畴。【选项分析】A/B/C——珍稀脊椎动物。D. 蜘蛛——正确（不属于），无脊椎动物。'},
],
s4a2:[
  {q:'判断物体是否运动，需要看它相对于什么的位移变化？',o:['自己','地面','参照物','天空'],a:2,t:0,e:'【知识点】判断一个物体是否运动，要选择一个参照物，看这个物体相对于参照物的位置有没有发生变化。参照物是默认静止的物体。【选项分析】A. 自己——不能用物体自身判断自身运动，这是逻辑错误。B. 地面——地面只是参照物的一种，不是唯一选择。C. 参照物——正确。D. 天空——不科学。'},
  {q:'"两岸青山相对出"中，参照物是什么？',o:['山','船','河岸','天空'],a:1,t:0,e:'【知识点】"两岸青山相对出"描写的是诗人坐在船上，看到两岸的山好像在迎面走来。以船为参照物（船在前进），山相对于船的位置在变化，所以感觉山在"动"。【选项分析】如果以岸为参照物，山是静止的；只有以行驶的船为参照物，山才看起来在"相对出"。'},
  {q:'"孤帆一片日边来"中，参照物是什么？',o:['帆船','太阳','江岸','以上都是'],a:2,t:0,e:'【知识点】"孤帆一片日边来"描述帆船从太阳的方向驶来。诗人站在江岸上，以江岸为参照物，帆船相对于江岸的位置在变化（越来越近），所以能看到帆船"来"。【选项分析】A. 帆船——如果以帆船自身为参照物，帆船是静止的。C. 江岸——正确，以不动的地面为参照物。D——不是所有都对。'},
  {q:'坐在行驶的汽车里，以汽车为参照物，乘客是？',o:['运动的','静止的','无法判断','有时运动有时静止'],a:1,t:0,e:'【知识点】乘客坐在车里，相对于汽车的位置没有变化，所以以汽车为参照物时乘客是静止的。【选项分析】如果以路边的树为参照物，乘客则是运动的。同一物体选择不同参照物，运动状态的判断结果可能不同——这就是"运动是绝对的，静止是相对的"。'},
  {q:'描述物体的位置需要哪两个要素？',o:['时间和速度','方向和距离','重量和体积','速度和方向'],a:1,t:0,e:'【知识点】描述物体在某时刻的位置，需要两个要素：方向（如"东偏北30°"）和距离（如"400米"），合起来就是"相对于参照物的方向和距离"。【选项分析】A——时间和速度是描述运动快慢的。C——重量和体积是描述物体自身属性的。D——速度描述快慢，不直接描述位置。'},
  {q:'关于运动和静止，说法正确的是？',o:['运动是相对的，静止是绝对的','运动是绝对的，静止是相对的','运动和静止都是绝对的','运动和静止都是相对的'],a:1,t:0,e:'【知识点】宇宙中一切物体都在不断地运动着——地球在自转和公转，所以运动是绝对的。静止只是相对于某个参照物而言的——你坐在椅子上不动，相对于椅子你是静止的，但相对于太阳你正在随地球飞快运动。【选项分析】静止只是相对于特定参照物的"看起来不动"，本质上是相对的。'},
  {q:'荡秋千属于哪种运动形式？',o:['旋转','振动','摆动','绕圈'],a:2,t:1,e:'【知识点】物体来回摇摆的运动叫作摆动。秋千来回运动、钟摆来回运动，都属于同一种运动形式——摆动。它有一个固定的悬挂点和往复的运动轨迹。【选项分析】A. 旋转——像风车那样绕轴转动。B. 振动——小幅快速的抖动。C. 摆动——正确。D. 绕圈——像旋转木马那样围绕中心点转圈。'},
  {q:'风车的转动属于什么运动？',o:['直线运动','曲线运动','前进','后退'],a:1,t:1,e:'【知识点】运动路径是直线的叫直线运动（如苹果落地），运动路径是曲线的叫曲线运动。风车叶片绕着中心轴转圈，轨迹是圆（曲线），所以属于曲线运动。【选项分析】A——风车不沿直线运动。B. 曲线运动——正确。C/D——前进和后退通常是直线运动。'},
  {q:'苹果落地是什么运动？',o:['曲线运动','摆动','直线运动','旋转'],a:2,t:1,e:'【知识点】苹果从树上落下，在重力作用下竖直下落，运动轨迹是一条直线，所以属于直线运动。判断标准很简单——看物体走的路径是直的还是弯的。【选项分析】A——苹果不走弯曲路径。C. 直线运动——正确。D——苹果没有绕轴转动。'},
  {q:'旋转木马的运动是？',o:['单一的绕圈运动','单一的上下运动','绕圈和上下运动的复合','直线和摆动的复合'],a:2,t:1,e:'【知识点】很多运动都不是单一的。旋转木马一方面绕中心轴绕圈（曲线运动），另一方面木马会升高降低（上下运动），所以是两种运动的复合。【选项分析】生活中大多数运动都是复合运动——既不是单纯的直线也不是单纯的旋转。'},
  {q:'直升飞机螺旋桨在旋转的同时上升，这属于？',o:['单一运动','复合运动','直线运动','曲线运动'],a:1,t:1,e:'【知识点】和旋转木马类似，直升机螺旋桨在运行过程中同时进行两种运动：旋转（绕轴转动）和上升（直线运动），这种由多种简单运动组合而成的运动叫复合运动。'},
  {q:'速度的计算公式是？',o:['速度=时间÷路程','速度=路程÷时间','速度=路程×时间','速度=路程+时间'],a:1,t:2,e:'【知识点】速度表示运动的快慢，公式为速度=路程÷时间。通俗地说：一定时间内走了多远。单位通常是千米/小时或米/秒。【选项分析】A——时间÷路程得到的是"每单位路程耗时"，不是速度。B——正确。C/D——不符合速度的定义。'},
  {q:'声音在空气中的速度约为？',o:['34米/秒','340米/秒','3400米/秒','3亿米/秒'],a:1,t:2,e:'【知识点】声音在空气中的传播速度约为340米/秒（即1秒钟能传340米）。而光速约为3亿米/秒（30万千米/秒）。这就是为什么打雷时总是先看到闪电再听到雷声——光比声音快太多了。【选项分析】A太小（34米/秒约为汽车速度），C/D太大。3亿米/秒是光速。'},
  {q:'为什么不能高空抛物？',o:['物体会变形','速度越快冲击力越大','空气阻力会消失','物体会飘走'],a:1,t:2,e:'【知识点】物体下落过程中会不断加速，落地时速度很大，而速度越大冲击力越大。即使是很轻的物体，从高空落下也可能对人造成严重伤害。【选项分析】能量与速度的平方成正比，速度翻倍时冲击力翻四倍。禁止高空抛物保护的是他人安全。'},
  {q:'比较物体运动快慢，在相同路程下应该比？',o:['速度','时间','距离','质量'],a:1,t:2,e:'【知识点】比较运动快慢有两种方法：①相同路程比时间——谁用的时间短谁快；②相同时间比路程——谁走的路程远谁快。这两种方法背后都是"速度=路程÷时间"的公式。【选项分析】题目给了"相同路程"的条件，应当比较时间。'},
],
s4a3:[
  {q:'力不能做到的是？',o:['使物体运动','使物体静止','改变运动方向','改变物体颜色'],a:3,t:0,e:'【知识点】力可以改变物体的运动状态：让静止的物体运动、让运动的物体停下来、改变运动的速度大小或方向。但力不能改变物体的颜色、气味等内在性质。【选项分析】A/B/C——都是力的作用效果。D. 改变物体颜色——正确（力做不到），改变颜色是化学反应或物理染色，不是力的作用。'},
  {q:'在拉力与小车快慢的实验中，需要保持不变的是？',o:['拉力大小','小车质量和路程','钩码数量','小车速度'],a:1,t:0,e:'【知识点】做对比实验要控制变量——只有一个条件不同，其他条件保持不变。研究"拉力大小对小车快慢的影响"时，拉力是变量，而小车的质量和路程必须保持不变，这样结果才有可比性。【选项分析】A——拉力是实验要改变的量。B——正确，质量和路程是受控条件。C/D——钩码数量就是拉力的体现，速度是结果。'},
  {q:'拉力越大，小车前进会？',o:['越慢','越快','先快后慢','不变'],a:1,t:0,e:'【知识点】对同一辆小车施加不同大小的拉力，拉力越大，小车获得的速度越大，即前进越快。力是改变物体运动状态的原因——力越大，运动状态的改变越显著。'},
  {q:'弹簧测力计测量的是什么？',o:['质量','力','长度','温度'],a:1,t:1,e:'【知识点】弹簧测力计利用弹簧的弹性原理来测量力的大小。单位为牛顿（N）。它不是用来测质量、长度或温度的——测质量用天平，测长度用尺子，测温度用温度计。【选项分析】注意不要和"称重"混淆——天平和秤测的是质量（克/千克），弹簧测力计测的是力（牛顿）。'},
  {q:'力的单位用什么表示？',o:['千克（kg）','米（m）','牛顿（N）','秒（s）'],a:2,t:1,e:'【知识点】力的单位是牛顿，简称牛，符号N。这是为了纪念科学家牛顿。千克是质量单位，米是长度单位，秒是时间单位。【选项分析】记住：称体重用千克（质量），测力的大小用牛顿。'},
  {q:'在弹性限度内，每增加相同拉力，弹簧伸长量会？',o:['越来越长','越来越短','每次都增加相同长度','无法确定'],a:2,t:1,e:'【知识点】在弹性限度内，弹簧的伸长量与受到的拉力成正比——这就是"胡克定律"的通俗理解。比如加1个钩码伸长2厘米，加2个钩码就伸长4厘米，每次增加的量是一样的。【选项分析】"弹性限度内"是一个重要前提——超过这个限度弹簧就坏了，伸长规律也不成立了。'},
  {q:'使用弹簧测力计时，视线应该？',o:['俯视','仰视','与指针齐平','随便怎么看'],a:2,t:1,e:'【知识点】读数时视线要与指针齐平（平视），就像读量筒刻度要平视液面一样。俯视会导致读数偏大，仰视会导致读数偏小——这就是读数误差的来源。'},
  {q:'使用弹簧测力计前，指针需要调到？',o:['1刻度','0刻度','最大刻度','中间刻度'],a:1,t:1,e:'【知识点】任何测量工具使用前都要"归零"——就是把指针调回零刻度。如果不归零就直接测量，得到的数值会偏大或偏小（系统误差）。弹簧测力计的调零方式是手动调节指针位置。'},
  {q:'下列哪种做法是为了增大摩擦力？',o:['加润滑油','冰壶刷冰','轮胎加深花纹','戴泳帽'],a:2,t:2,e:'【知识点】增大摩擦力的方法：增大接触面粗糙程度（加深花纹、防滑链）或增大压力（抹镁粉增加握力）。减小摩擦力的方法：加润滑油、刷冰（使接触面更光滑）、流线型设计、使用滚珠轴承。【选项分析】A/B——减小摩擦。C. 轮胎加深花纹——正确，凹凸的花纹增大接触面粗糙度从而增大摩擦。D. 戴泳帽——减小游泳时水的阻力。'},
  {q:'下列哪种做法是为了减小摩擦力？',o:['抹镁粉','加深花纹','套防滑链','给车轴上润滑油'],a:3,t:2,e:'【知识点】减小摩擦力最主要的方法就是润滑——在接触面之间加入润滑油，形成一层油膜，让表面更光滑。车轴加润滑油可以减少车轮转动时的摩擦阻力，提高效率。【选项分析】A/B/C——增大摩擦力的做法。D——正确，润滑油减小摩擦。'},
  {q:'冰壶比赛中刷冰是为了？',o:['增大摩擦力','减小摩擦力','让冰融化','美观'],a:1,t:2,e:'【知识点】冰壶运动中，运动员用刷子快速刷擦冰面，使冰面产生一层薄薄的水膜，大大减小了冰壶与冰面之间的摩擦力，让冰壶滑得更远。【选项分析】刷冰是为了光滑→减小摩擦。和给车轴加润滑油是同样的原理。'},
  {q:'鲸或海豚的身体呈流线型，主要作用是？',o:['便于散热','减小水的阻力','美观','便于捕食'],a:1,t:2,e:'【知识点】流线型体型的最大好处是减小在水中或空气中运动时的阻力（摩擦力）。鲸、海豚、鲨鱼、飞机、汽车都是典型例子。前端圆、后端尖的形状能让流体顺利流过，阻力最小。【选项分析】这是仿生学的经典案例——人类模仿鲸的流线型设计潜水艇和快艇。'},
  {q:'浮力的方向是？',o:['竖直向下','竖直向上','水平向左','任意方向'],a:1,t:3,e:'【知识点】浮力始终是竖直向上的，和重力方向正好相反。不管物体在水中处于什么位置、什么姿势，水对它的浮力总是竖直向上的。重力的方向竖直向下，所以物体受的合力=重力↓-浮力↑，决定了它是沉还是浮。'},
  {q:'石头沉入水底，它受到浮力吗？',o:['不受','受浮力','只有一半受','取决于大小'],a:1,t:3,e:'【知识点】只要物体在液体中，无论它是沉是浮，都受到来自液体的浮力！区别在于：漂浮的物体浮力=重力（二力平衡）；下沉的物体浮力<重力（重力更大所以沉下去）。石头虽然沉底了，但它压在水底时仍然受到水的浮力。'},
  {q:'饺子煮熟后漂起来是因为？',o:['重力减小','体积变大浮力变大','水温变高','锅变大了'],a:1,t:3,e:'【知识点】"生沉熟浮"现象：饺子在加热过程中，馅料中的空气和水分膨胀，使饺子的体积增大。浮力大小与物体排开液体的体积成正比——体积变大了，排开的水更多了，浮力就变大了。当浮力大于重力时，饺子就浮上来了。【选项分析】饺子的质量（重力）没有变，变的是体积→变的是浮力。'},
  {q:'体积相同，质量越大的物体在水中越容易？',o:['上浮','下沉','悬浮','不变'],a:1,t:3,e:'【知识点】体积相同的条件下，质量越大的物体越容易下沉。可以这样理解：体积相同=排开的水量相同=浮力相同。但质量大意味着重力更大，在浮力不变的情况下，重力>浮力→下沉。【选项分析】同样大小的铁球和木球放入水中，铁球沉木球漂——因为铁的质量更大。'},
  {q:'质量相同，体积越大的物体在水中越容易？',o:['上浮','下沉','不变','无法判断'],a:0,t:3,e:'【知识点】质量相同的条件下，体积越大的物体排开的水越多，受到的浮力越大，所以越容易上浮。例如：同样重的实心铁球和空心铁球，空心铁球体积更大，排开更多水→浮力更大→更容易漂。【选项分析】质量和体积同时影响沉浮——不能只看其中一个。'},
],
s4a4:[
  {q:'完整电路不包括哪个部分？',o:['电源','用电器','开关','电池盒'],a:3,t:0,e:'电池盒不是电路的必要组成部分，它只是用来装电池的容器。电路四要素是：电源、用电器、导线、开关。'},
  {q:'灯泡要亮起来，导线两端应分别连接？',o:['正极和正极','负极和负极','正极和负极','任意连接'],a:2,t:0,e:'必须连接正极（+）和负极（-），形成闭合回路，电流才能流通，灯泡才会亮。'},
  {q:'直接用导线连接电池正负极叫做？',o:['断路','短路','通路','回路'],a:1,t:0,e:'短路会跳过用电器直接连通两极，电流过大，会导致电池发热甚至爆炸，非常危险！'},
  {q:'短路会导致什么后果？',o:['灯泡更亮','电池发热甚至爆炸','电路更稳定','没什么影响'],a:1,t:0,e:'【知识点】短路是非常危险的：直接用导线把电池正负极连接起来，电流不经过用电器直接从导线流过，电流非常大，会产生大量热量，导致电池发热、损坏甚至爆炸。【选项分析】短路时电流绕过了灯泡，灯泡根本不会亮。短路不是"更稳定"，而是最危险的情况。'},
  {q:'画电路图时，起点和终点分别是？',o:['正极和负极','负极和正极','开关和灯泡','任意两点'],a:0,t:0,e:'【知识点】规范的电路图中，电流从电池的正极（+）出发，依次经过开关、用电器等元件，最后回到电池的负极（-），形成一个完整的闭合回路。起点永远是正极，终点永远是负极。'},
  {q:'下列哪种是导体？',o:['塑料尺','铅笔芯','橡皮','玻璃'],a:1,t:1,e:'【知识点】容易导电的物体叫导体，包括：铁钉、铅笔芯、硬币、铝箔、盐水、人体等。铅笔芯的主要成分是石墨，石墨能导电。【选项分析】塑料尺、橡皮、玻璃都是绝缘体——不容易导电。电工常用工具的手柄就是塑料做的，起绝缘保护作用。'},
  {q:'下列哪种是绝缘体？',o:['铁钉','铝箔','硬币','瓷勺'],a:3,t:1,e:'【知识点】不容易导电的物体叫绝缘体，如塑料、陶瓷、橡胶、玻璃、干木头等。瓷勺是陶瓷制品，不导电。【选项分析】A/B/C——铁钉、铝箔、硬币都是金属，金属是良好的导体。D. 瓷勺——正确，陶瓷是绝缘体。'},
  {q:'导电能力从弱到强排列正确的是？',o:['纯净水<自来水<淡盐水<浓盐水','自来水<纯净水<淡盐水<浓盐水','浓盐水<淡盐水<自来水<纯净水','纯净水<自来水<浓盐水<淡盐水'],a:0,t:1,e:'【知识点】水本身不导电（纯净水是绝缘体），导电的是溶解在水中的盐分（离子）。含盐越多，导电能力越强。所以：纯净水（几乎不导电）→自来水（含微量矿物质）→淡盐水（有一定盐分）→浓盐水（含盐最多、导电最强）。【选项分析】这是水溶液电导率的基本规律。'},
  {q:'铅笔芯是导体，为什么有的铅笔芯不能让小灯泡亮？',o:['铅笔芯是绝缘体','不同铅笔芯导电能力不同','铅笔芯只有在特定条件下导电','以上都不对'],a:1,t:1,e:'【知识点】铅笔芯的主要成分是石墨和黏土。含石墨越多，铅笔芯越软（如2B），导电性越好；含黏土越多，铅笔芯越硬（如2H），导电性越差。所以不同型号的铅笔芯导电能力差异很大，有的不足以让灯泡变亮。【选项分析】不能说铅笔芯是绝缘体——它确实是导体，只是导电性强弱不同。'},
  {q:'电工螺丝刀的把手用什么材料制造？',o:['金属','绝缘体','导体','半导体'],a:1,t:1,e:'【知识点】电工工具的把手（人手接触的部分）必须用绝缘体材料（塑料或橡胶）制造，目的是防止电流通过人体——保护电工的安全。工具的工作部分（如螺丝刀头）用金属，接触电线的部分需要导电能力。【选项分析】为什么不全用金属？因为把手用金属会导电到人身上，非常危险。'},
  {q:'电路暗箱检测中，灯泡变亮说明？',o:['增加了用电器','增加了电池','电路断路','接触不良'],a:1,t:2,e:'【知识点】电路检测器检测暗箱的原理：灯泡亮度变化反映了电路中电压或电阻的变化。灯泡变亮说明电压增大——意味着暗箱里有额外电池串联进来了。灯泡变暗或熄灭说明电阻增大——意味着暗箱里有用电器串联进来了。【选项分析】"变亮"="能量多了"="有电池"。记住：亮=电池，暗=用电器。'},
  {q:'电路暗箱检测中，灯泡变暗说明？',o:['增加了用电器','增加了电池','电路连通','没有变化'],a:0,t:2,e:'【知识点】同样道理，灯泡变暗说明电路中总电阻增大了——暗箱里串联进来了用电器（如另一个灯泡），导致电压被两个用电器分摊，每个分到的电压变小，所以原来的灯泡变暗。【选项分析】和上一题对应记忆：灯泡变亮=暗箱有电池，变暗=暗箱有用电器。'},
  {q:'检测电路暗箱前，首先要做什么？',o:['拆开暗箱','自检检测器','更换电池','增加灯泡'],a:1,t:2,e:'【知识点】每次使用电路检测器前，必须先用已知导通的电路自检——把检测器的两个接线端碰在一起，看灯泡是否亮。如果自检时不亮，说明检测器本身有问题，用它检测的结果就不可靠。【选项分析】这和天平称重前先调零、弹簧测力计使用前先归零是一个道理——工具本身准了，测出来的才可信。'},
  {q:'每次检测一般需要测几次？',o:['1次','2次','3次','越多越好'],a:2,t:2,e:'【知识点】科学实验中，为了减小偶然误差，每次检测至少重复3次。如果3次结果一致，就可以得出可靠结论。如果其中某次结果不同，需要再测，找出原因。只测1次可能刚好遇到接触不良等意外情况，结果不可靠。'},
  {q:'电动车使用的是？',o:['交流电','直流电','高压电','静电'],a:1,t:3,e:'【知识点】电分直流电和交流电。直流电由电池提供（如手机电池、电动车电池），电流方向不变。交流电来自发电厂，通过电网传输到家庭（如电灯、冰箱用的电），电流方向来回变换。【选项分析】电动车靠电池供电→直流电。家里的电灯、电视、空调用的是交流电。'},
  {q:'水果电池中，铜片是什么极？',o:['负极','正极','阴阳极','接地极'],a:1,t:3,e:'【知识点】在水果电池中（如橙子电池），插入铜片和锌片两种不同金属。铜片充当正极（+），锌片充当负极（-）。LED灯的长脚连接正极（铜片），短脚连接负极（锌片），灯才会亮。【选项分析】这是原电池的基本原理——两种不同金属在电解质中产生电压，较活泼的金属（锌）做负极，较不活泼的金属（铜）做正极。'},
  {q:'橙子可以当作电池，需要插入哪两种金属片？',o:['铁片和铝片','铜片和锌片','金片和银片','铜片和铁片'],a:1,t:3,e:'【知识点】制作水果电池需要两种不同活性的金属片——铜片和锌片是最常用的组合。橙子、柠檬、番茄、土豆这些含有酸性汁水的水果蔬菜都可以用来做水果电池，因为它们含有可作为电解质的液体。【选项分析】如果单片金属，或者使用相同金属，无法形成电压差，就不会产生电流。'},
  {q:'以下哪种做法是安全的？',o:['湿手摸开关','高压线附近放风筝','用干布擦拭断电的电器','多个电器插同一插座长时间使用'],a:2,t:3,e:'【知识点】安全用电常识：①不用湿手触摸开关——水导电容易触电；②不在高压线附近放风筝——可能被电击或导致短路；③清洁电器前先断电，用干布擦拭；④不把太多电器同时插在一个插座上——会导致电流过大引起火灾。【选项分析】A/B/D都是危险行为。C是安全的——先断电再清洁。'},
],
s3b1:[
  {q:'种子发芽不需要什么条件？',o:['水分','空气','阳光','适宜温度'],a:2,t:0,e:'【知识点】种子发芽的三个必需条件是：适量的水分、充足的空气和适宜的温度。阳光不是种子发芽的必需条件——实验证明，在完全黑暗的环境中种子也能正常发芽。【选项分析】种子发芽靠的是种子内部的营养（子叶中的养分），不需要光合作用，所以不需要阳光。等到长出叶子之后，阳光才变得重要。'},
  {q:'种子发芽需要哪三个条件？',o:['水+空气+温度','水+阳光+土壤','空气+阳光+养分','温度+阳光+水'],a:0,t:0,e:'【知识点】种子发芽三要素：水分（润湿种皮、激活种子）、空气（供给呼吸需要的氧气）、适宜温度（促进生化反应）。阳光和土壤不需要——种子可以在黑暗中发芽，也可以不用土壤（如纸巾催芽法）。【选项分析】B/C/D都含有阳光或土壤，不是必需条件。'},
  {q:'番茄种子的形状是？',o:['圆形','水滴形','橄榄形','长方形'],a:1,t:0,e:'【知识点】不同植物的种子有不同特征：番茄种子呈水滴形、黄色、表面粗糙；黄瓜种子呈橄榄形、乳白色、表面光滑。观察种子的形态是认识植物的重要方式。【选项分析】番茄种子的典型形状就像一滴水滴——一头尖一头圆。'},
  {q:'植物的根的作用不包括？',o:['吸收水分','吸收养料','固定植株','制造养料'],a:3,t:1,e:'【知识点】根的两大作用：①吸收水分和溶解在水中的矿物质养料；②牢牢固定植株，防止倒伏。制造养料是叶子的工作——叶子通过光合作用利用阳光、水和二氧化碳制造养料。【选项分析】根负责"吸收"，叶子负责"制造"，分工明确。'},
  {q:'茎的主要作用是？',o:['吸收水分','光合作用','输送水分和养料','开花结果'],a:2,t:1,e:'【知识点】茎是植物的"运输管道"——将根吸收的水分和养料向上输送到叶子，同时将叶子制造的营养物质向下输送到根和其他部位。【选项分析】A——根的工作。B——叶的工作。C——正确，茎的核心功能是运输。D——花和果实的工作。'},
  {q:'把植物插入红色水中，茎和叶变红说明？',o:['根有吸收作用','茎有输送作用','叶能光合作用','花能繁殖'],a:1,t:1,e:'【知识点】证明茎的输送作用的经典实验：把植物的茎插入红色水中，一段时间后茎和叶变红，说明红色水通过茎的导管向上输送到叶片中（叶脉变红）。这是茎"运输管道"功能的直接证据。【选项分析】这个实验与根无关——因为植物已经被剪断了根，是靠茎直接吸水。'},
  {q:'根、茎、叶属于植物的？',o:['繁殖器官','营养器官','运动器官','感觉器官'],a:1,t:1,e:'【知识点】植物器官分为两类：营养器官（根、茎、叶——负责生存生长）和繁殖器官（花、果实、种子——负责繁殖后代）。【选项分析】记住"营养三件套"——根茎叶。繁殖器官是花果实种子。'},
  {q:'番茄花属于什么花？',o:['单性花','两性花','虫媒花','风媒花'],a:1,t:2,e:'【知识点】花的分类方法有两种：按性别——雌雄蕊同花为两性花（如番茄花），雌雄蕊不同花为单性花（如黄瓜开花有雄花和雌花之分）；按传粉方式——虫媒花（颜色鲜艳、有香气如桃花）和风媒花（花粉多而轻如玉米花）。【选项分析】番茄花在一朵花中同时有雌蕊和雄蕊，所以是两性花。'},
  {q:'黄瓜的花属于什么花？',o:['两性花','单性花','完全花','不孕花'],a:1,t:2,e:'【知识点】黄瓜的花分为雄花和雌花两种，雄花只有雄蕊，雌花只有雌蕊，所以属于单性花。只有雌花才能结出黄瓜。正因为雌雄不在同一朵花上，黄瓜需要人工辅助授粉——把雄花的花粉涂抹到雌花的柱头上。【选项分析】黄瓜开花→雄花和雌花分开→单性花→需要人工帮助授粉才能结果。'},
  {q:'桃花主要通过什么方式传粉？',o:['风力','昆虫','自花传粉','人工辅助'],a:1,t:2,e:'【知识点】桃花颜色鲜艳、气味芳香、花蜜甜美，这些特征都是为了吸引蜜蜂、蝴蝶等昆虫来帮助传粉，属于典型的虫媒花。昆虫在采蜜过程中，花粉会粘在身体上，飞到另一朵花时完成传粉。【选项分析】风媒花（如玉米、小麦）不需要鲜艳的花瓣——它们的花通常小巧朴素，靠风传播大量轻飘的花粉。'},
  {q:'玉米主要通过什么方式传粉？',o:['风力','昆虫','自花传粉','人工辅助'],a:0,t:2,e:'【知识点】玉米是典型的风媒花——雄穗高高举起，花粉数量极多且非常轻，随风飘散。雌穗的花丝（玉米须）伸出苞叶，在空中截获花粉。【选项分析】玉米花不鲜艳也不香——因为不需要吸引昆虫。大量花粉依靠空气流动传播，效率虽低但靠数量取胜。'},
  {q:'果实由哪两部分组成？',o:['果皮+种子','果肉+种子','花瓣+种子','果皮+果肉'],a:0,t:3,e:'【知识点】果实的基本结构是果皮和种子。果皮保护种子，种子可以长成新植株。我们吃的苹果肉其实是果皮的一部分（花托发育而来），里边的苹果籽才是种子。【选项分析】不是所有果实都有可口的"果肉"——有些果实的果皮是干硬的（如豆荚）。但所有果实都有果皮和种子。'},
  {q:'胡萝卜可食用的是哪个部位？',o:['茎','根','叶','果实'],a:1,t:3,e:'【知识点】不同蔬菜可食用的部位不同：胡萝卜是根（肉质直根）、土豆是茎（块茎，上面有芽眼能发芽）、白菜是叶、花菜是花、苹果是果实、花生是种子。判断方法：有芽眼的通常是茎（土豆、藕、姜）。'},
  {q:'土豆可食用的是哪个部位？',o:['根','茎','叶','果实'],a:1,t:3,e:'【知识点】土豆是块状茎。它上面的"芽眼"能发芽长成新植株——这是茎的特征，根没有芽眼。把土豆切开埋进土里，每个有芽眼的块都能长出新土豆。【选项分析】土豆≠根。类似的茎类蔬菜还包括：藕、荸荠、姜。'},
  {q:'植物的一生顺序是？',o:['开花→结果→发芽→长大','发芽→长大→开花→结果→死亡','结果→开花→长大→发芽','长大→发芽→开花→结果'],a:1,t:3,e:'【知识点】植物完整生命周期：种子吸水膨胀→破皮发芽→幼苗长大→开花→传粉受精→结果→种子成熟→植株衰老死亡。其中从发芽到开花前是营养生长阶段（长根茎叶），开花后进入繁殖生长阶段。【选项分析】正常顺序肯定是先发芽→后开花→后结果，不可能反过来。'},
  {q:'仙人掌的叶退化成刺是为了？',o:['美观','减少水分蒸发','防御天敌','吸收阳光'],a:1,t:4,e:'【知识点】仙人掌生活在沙漠中，环境炎热干旱。为了适应这样的环境，它的叶子退化成针状（刺），大大减少了水分的蒸发面积。同时肥厚的茎可以储存大量水分。【选项分析】这是"环境适应"的经典案例——每种植物都有适应其生活环境的特殊结构。'},
  {q:'水葫芦能漂浮在水面是因为叶柄内有？',o:['大量水分','大量孔洞储存气体','大量养分','大量纤维'],a:1,t:4,e:'【知识点】水葫芦（凤眼莲）的叶柄膨大成气囊状，里面储存了大量气体（像一个小气囊），使整株植物能漂浮在水面上。这是水生植物适应水中生活环境的特殊结构。【选项分析】植物的结构总是与其生活环境相适应——水中生长需要有漂浮能力或中空管道来支撑呼吸。'},
  {q:'莲的叶柄和地下茎内有什么结构保证水下部分对氧气的需求？',o:['实心结构','中空的管道','粗壮的纤维','厚实的表皮'],a:1,t:4,e:'【知识点】莲生活在水中，地下茎和叶柄被水和淤泥包围，难以获取氧气。所以莲的叶柄和地下茎内演化出了中空的管道（通气组织），可以把叶子从空气中吸收的氧气输送到水下部分。【选项分析】"中空管道"是水生植物呼吸的关键结构设计。藕切开就能看到明显的孔洞——那就是通气管道。'},
  {q:'青苔的"根"实际上是？',o:['真正的根','假根，起固定作用','储藏器官','繁殖器官'],a:1,t:4,e:'【知识点】青苔（苔藓植物）没有真正的根，它底下那些看似根的结构叫"假根"，主要作用是固定植株。青苔没有真正的维管组织（根茎叶的分化不发达），所以它吸收水分和养料主要靠整个植物体的表面，而不是靠假根。【选项分析】"假根"一词就说明了一切——长得像根但不具备根的全部功能。'},
],
s3b2:[
  {q:'声音是由物体的什么产生的？',o:['碰撞','振动','摩擦','电流'],a:1,t:0,e:'【知识点】声音是由物体振动产生的。振动停止，声音消失。所有声音的来源都是振动——说话时声带振动，弹吉他时琴弦振动，敲鼓时鼓面振动。【选项分析】碰撞、摩擦可能导致振动，但碰撞和摩擦本身不是声音的直接原因——它们引起的振动才是。电流本身也不直接产生声音。'},
  {q:'敲击音叉后接近水面会激起水花，说明？',o:['音叉在振动','音叉带电','水有浮力','音叉很热'],a:0,t:0,e:'【知识点】这个实验巧妙地"可视化"了被敲音叉的振动——虽然我们肉眼看不到音叉振动，但把振动的音叉靠近水面，水面会被弹起水花，证明音叉确实在快速振动。正是这种振动产生了我们听到的音叉声。【选项分析】振动→响声，这个因果关系贯穿整个声音章节。'},
  {q:'哺乳动物用什么器官发声？',o:['鸣管','声带','翅膀','气孔'],a:1,t:0,e:'【知识点】不同动物有不同发声器官：哺乳动物用声带（位于喉部，气流通过声带引起振动发声）；鸟类用鸣管（一种特殊的发声器官，效果类似于人类的声带但结构不同）；昆虫靠翅膀摩擦或振动发声。【选项分析】记住对应关系：哺乳→声带，鸟→鸣管，虫→翅膀。'},
  {q:'鸟类用什么器官发声？',o:['声带','鸣管','翅膀','鳃盖'],a:1,t:0,e:'【知识点】鸟类的发声器官叫鸣管，位于气管和支气管交界处。鸣管结构精巧，使鸟类能发出丰富多变的声音——不同鸟类有不同的鸣叫。【选项分析】鸟类没有声带（那是哺乳动物的）。小鸟鸣叫不是靠翅膀拍打——翅膀是用来飞行的。'},
  {q:'声音不能在什么中传播？',o:['气体','液体','固体','真空'],a:3,t:1,e:'【知识点】声音的传播需要介质（物质）。声音能在气体、液体、固体中传播，但不能在真空中传播。月球上没有空气（真空），所以宇航员在月球上不能直接听到彼此说话，需要用无线电通信。【选项分析】"太空是寂静的"——这句话的道理就在于声音无法在真空中传播。'},
  {q:'声音在什么中传播效果最好？',o:['气体','液体','固体','真空中'],a:2,t:1,e:'【知识点】声音在固体中传播效果最好（最快最清晰），其次液体，最差是气体。这是因为固体的分子排列紧密，振动更容易传递。在真空中完全不能传播。【选项分析】这就是为什么贴着铁轨能听到远处火车的动静——固体传声比空气好得多。'},
  {q:'贴着桌面听挠桌子的声音更清楚，说明？',o:['固体传声比气体好','气体传声比固体好','液体传声最好','真空传声最好'],a:0,t:1,e:'【知识点】这是一道验证题——同样的挠桌子声，耳朵贴着桌面（通过固体传声）比隔空听（通过空气传声）清楚得多，证明固体传播声音的效果优于气体。'},
  {q:'耳朵结构中，鼓膜的作用是？',o:['收集声音','引起振动','传递信号','维持平衡'],a:1,t:2,e:'【知识点】耳朵主要结构（由外到内）：耳郭（收集声音）→外耳道→鼓膜（声波引起鼓膜振动）→听小骨（放大振动）→耳蜗（将振动转化为神经信号）→听神经（传递信号到大脑）。鼓膜的核心作用是"将声波转化为振动"——就像一面小鼓，声音一到达就跟着振动起来。'},
  {q:'耳朵听到声音的顺序是？',o:['鼓膜→耳蜗→听神经','耳郭→鼓膜→听小骨→耳蜗→听神经','耳蜗→鼓膜→听小骨','听神经→耳蜗→鼓膜'],a:1,t:2,e:'【知识点】完整听觉路径：耳郭收集声波→外耳道传导→鼓膜振动→听小骨放大→耳蜗将振动变为电信号→听神经传输到大脑。任何一环出问题都会影响听力。【选项分析】A少了好几步（缺失耳郭和听小骨），C/D顺序完全反了。'},
  {q:'下列哪种做法能保护听力？',o:['经常挖耳朵','长时间戴耳机','远离噪声环境','用尖锐物掏耳'],a:2,t:2,e:'【知识点】保护听力三项原则：①不随便挖耳朵（可能戳破鼓膜或引起感染）；②远离噪声环境或佩戴防噪耳塞（长时间噪声会损伤耳蜗中的毛细胞，不可逆）；③不长时间开大音量听耳机。【选项分析】A/D都可能损伤外耳道或鼓膜。B会导致听力逐渐下降。C是正确的。'},
  {q:'弹拨较短的尺子，声音会？',o:['音量变大','音调变高','音调变低','音量变小'],a:1,t:3,e:'【知识点】音调=声音的高低。短的、薄的、紧的物体发出的音调更高；长的、厚的、松的物体发出的音调更低。尺子伸出桌面越短，弹拨时振动频率越快→音调越高。这不是音量（强弱）的差别。【选项分析】音调≠音量。同样的力度弹拨短尺和长尺，音调不同但音量差不多。'},
  {q:'"音量"指的是声音的？',o:['高低','强弱','快慢','好坏'],a:1,t:3,e:'【知识点】音量是声音的强弱（大小），与振动幅度有关：用力越大→振动幅度越大→音量越大。音调是声音的高低，与振动频率有关：物体越短越薄越紧→频率越高→音调越高。【选项分析】"强弱"和"高低"是容易混淆的两个概念——通俗讲：音量是你喊多响，音调是声音多尖。'},
  {q:'噪声被列为什么？',o:['自然资源','环境污染因素','生产原料','生活用品'],a:1,t:3,e:'【知识点】噪声污染是世界公认的主要环境污染之一（和空气污染、水污染、固体废弃物污染并列为四大公害）。长期暴露在噪声环境中会损害听力、影响睡眠和心理健康。【选项分析】噪声不是资源也不是原料——它是人类活动中产生的、对人有害的声音，需要加以控制。'},
],
s3b3:[
  {q:'下列属于天然材料的是？',o:['塑料','玻璃','棉花','纸'],a:2,t:0,e:'【知识点】天然材料指直接来自大自然、未经加工或只经过简单处理的材料，如棉花（从棉株上采摘后经简单加工）、木材、石料、羊毛。【选项分析】塑料是石油经过化学合成的；玻璃是沙石高温熔炼制成的；纸是树木加工制成的人造材料。只有棉花是天然材料。'},
  {q:'下列属于人造材料的是？',o:['木材','石料','羊毛','玻璃'],a:3,t:0,e:'【知识点】人造材料是将天然材料（或其它物质）经过复杂的工业加工后制成的材料，如玻璃、塑料、纸、陶瓷、钢铁。玻璃的主要原料是沙子，但需要经过高温熔化、成型等复杂工艺才能制成。【选项分析】A/B/C——都是直接从自然界获取的天然材料。'},
  {q:'棉花和腈纶棉相比，棉花的特点是？',o:['吸水性弱','吸水性强','不燃烧','弹性好'],a:1,t:0,e:'【知识点】棉花（天然纤维）和腈纶棉（人造纤维）的性质对比实验：①吸水性——棉花强（滴水后迅速吸收），腈纶棉弱；②燃烧——棉花燃烧后产生黑色粉末状灰烬（燃纸味），腈纶棉燃烧后熔化形成黑色固体硬块（塑料味）。【选项分析】天然材料和人造材料在很多物理化学性质上有明显差异——燃烧实验是常用的鉴别方法。'},
  {q:'造纸术是我国古代四大发明之一，发明者是？',o:['张衡','蔡伦','毕昇','鲁班'],a:1,t:1,e:'【知识点】东汉时期，蔡伦改进了造纸术，用树皮、麻绳头、破布、旧渔网等废弃物为原料，生产出轻便、廉价的纸张。造纸术极大促进了人类文明的传播和发展。【选项分析】张衡——地动仪；毕昇——活字印刷术；鲁班——古代著名工匠。四大发明：造纸术、印刷术、火药、指南针。'},
  {q:'造纸术使用的原料不包括？',o:['树皮','破布','旧渔网','塑料'],a:3,t:1,e:'【知识点】蔡伦造纸的原材料包括树皮、麻绳头、破布、旧渔网——都是可降解的天然有机物。塑料是近现代的产物，蔡伦的时代（距今约1900年）根本没有塑料。【选项分析】"变废为宝"是蔡伦造纸术的核心思想——把人们不要的废旧物变成有用的纸张。'},
  {q:'金属的共同性质不包括？',o:['有光泽','可以导热','有延展性','不易降解'],a:3,t:2,e:'【知识点】金属三大共性：①有金属光泽（表面光亮可反光）；②可以导热（所以锅用金属做）；③有延展性（可以锤成薄片或拉成细丝，如金箔、铜线）。金属没有"不易降解"这个性质——金属会生锈腐蚀（铁锈是铁的氧化降解）。【选项分析】"不易降解"是塑料的问题，不是金属的性质。'},
  {q:'铜的颜色是？',o:['银白色','紫红色','金黄色','灰白色'],a:1,t:2,e:'【知识点】不同金属有不同颜色：铜是紫红色（铜导线的颜色）、铁是银白色、铝是银白色但比铁轻。【选项分析】黄金是金黄色的，银是银白色的。铜识别的关键颜色词就是"紫红色"。'},
  {q:'青铜器属于？',o:['单质金属','合金','天然材料','塑料'],a:1,t:2,e:'【知识点】青铜是铜和锡的合金。合金是由两种或多种金属（或金属与非金属）融合而成的材料。合金通常比单质金属性能更好——青铜比纯铜更硬、更耐磨。其它常见合金：不锈钢（铁+铬+镍）、铝合金（铝+铜+镁+硅）。'},
  {q:'塑料的优点不包括？',o:['质量轻','防水结实','价格便宜','容易降解'],a:3,t:3,e:'【知识点】塑料的四大优点：轻便、防水、结实耐用、价格低廉。塑料最大的缺点是极难降解——埋在地里上百年都基本不变。这导致了"白色污染"——废弃塑料在自然环境中长期存在。【选项分析】"容易降解"恰恰是塑料不具备的优势。'},
  {q:'减少白色污染的方法不包括？',o:['少用塑料袋','使用可降解塑料','回收废弃塑料','把塑料直接埋土里'],a:3,t:3,e:'【知识点】减少白色污染的正确做法：①源头减少使用（用布袋代替塑料袋）；②重复使用；③使用替代品（可降解塑料）；④回收利用。塑料埋在土里不会消失，只是暂时"藏起来"了，对土壤和地下水的污染仍然持续。【选项分析】掩埋不等于降解——塑料在土壤中仍会长期存在并释放有害物质。'},
  {q:'怎样辨别羊毛绳和塑料绳？',o:['看颜色','用火烧','摸手感','称重量'],a:1,t:3,e:'【知识点】燃烧法是鉴别天然纤维和人造纤维最可靠的方法：羊毛——燃烧时有特殊的焦臭味（类似头发烧焦的味道），燃烧后产生粉末状灰烬；塑料绳——燃烧时熔化发黑，产生黑色硬块和刺鼻的塑料味。【选项分析】只看颜色、摸手感不可靠——人造绳可以被染色、仿制触感。燃烧法最准确。'},
],
s3b4:[
  {q:'百叶箱的箱门应该朝哪个方向？',o:['南','北','东','西'],a:1,t:0,e:'【知识点】百叶箱有5条设计原则：①百叶窗式——确保通风良好；②内外涂白漆——反射阳光，避免箱体过热；③箱门朝北——避免阳光直接照射到箱内（我国在北半球，窗朝南光线最强，朝北光线最弱）；④架设在大片草坪上——减少地面光和热的反射影响；⑤箱底距离地面1.5米——这个高度空气变化较稳定，也是人类活动的高度，数据更有实用性。'},
  {q:'百叶箱的箱底距离地面多少米？',o:['1米','1.25米','1.5米','2米'],a:2,t:0,e:'【知识点】百叶箱箱底离地面1.5米。选择1.5米有两个原因：①这个高度空气流动和温度变化较稳定，读数代表性好；②这个高度大致是成人躯干的高度，测量的就是人类活动范围内的气温，实用性强。'},
  {q:'百叶箱涂成白色是为了？',o:['美观','多反射阳光','吸收热量','防雨'],a:1,t:0,e:'【知识点】百叶箱内外都涂白漆，利用了"白色物体反射阳光最多"的原理——白色能反射大部分太阳辐射，避免箱体被太阳晒得过热，从而保证测到的是真实的空气温度而不是"被烤热了的箱内温度"。如果涂成黑色，会把阳光吸进去，测出的温度会偏高。'},
  {q:'同一时间，哪里的气温更高？',o:['草地上','水泥地上','背阴处','水面上'],a:1,t:0,e:'【知识点】同一时间不同地点的气温差异：水泥地>草地（水泥吸热快升温多，草地植被有蒸腾降温作用）；阳光下>背阴处（阳光直射区域温度更高）。这也是为什么百叶箱要架设在草坪上——草坪对光和热的反射影响最小，测出的气温最能代表"真正的空气温度"。'},
  {q:'雨量的单位是？',o:['厘米','毫米','米','升'],a:1,t:1,e:'【知识点】降雨量是指一定时间内降落到地面的雨水深度（不考虑渗透或蒸发），用毫米表示。例如"24小时降雨量50毫米"，意思是如果雨水不流走、不渗透，积在地面上的深度是50毫米。气象部门据此划分小雨、中雨、大雨、暴雨等级。'},
  {q:'把天空分成四份，阴天是指云量超过？',o:['1/4','2/4','3/4','全部'],a:2,t:1,e:'【知识点】云量=天空被云遮盖的比例。把天空平均分成4份：云量不足1/4→晴天；云量在1/4到3/4之间→多云；云量超过3/4→阴天。这个标准是国际通用标准，简洁直观。【选项分析】注意是"超过3/4"才算阴天，正好3/4属于多云。'},
  {q:'风向指的是？',o:['风吹去的方向','风吹来的方向','风的大小','风的温度'],a:1,t:2,e:'【知识点】风向的定义是风吹来的方向（不是风吹去的方向）。例如：东风→风从东方吹来、吹向西方。这是气象学上的标准定义，用风向标来测量。【选项分析】最容易搞混的一点：东风吹向西，不是西吹向东。'},
  {q:'东风是从哪里吹来的风？',o:['西方','东方','南方','北方'],a:1,t:2,e:'【知识点】"东"在这里指的是来源方向。东风=来自东方的风=风从东吹到西。同理，北风是来自北方吹向南方的风（通常较冷），南风是来自南方吹向北方的风（通常较暖）。【选项分析】记住：风向=来源，不是去向。冬天刮北风→冷空气从北方来。'},
  {q:'"明天有大风"描述的是？',o:['天气','气候','季节','环境'],a:0,t:3,e:'【知识点】天气和气候的区别：天气=短时间内（一天或几天内）的气象状况（今天冷明天热、晴转多云、明天有大风），是多变的、没有规律的；气候=一个地区长时间（多年）的平均天气特征（四季如春、冬冷夏热、厦门气候温暖湿润），是比较稳定的、有规律的。【选项分析】"明天"是短期→描述的是天气。'},
  {q:'"四季如春"描述的是？',o:['天气','气候','气象','气温'],a:1,t:3,e:'【知识点】"四季如春"是指这个地区贯穿一年四季的整体天气都温和舒适——这是跨越多年的长期特征，描述的是气候。类似的：热带雨林气候终年高温多雨、极地气候终年严寒、地中海气候夏季干旱冬季湿润。【选项分析】注意"气候"和"天气"的区分是本章的核心考点之一——短期的是天气，长期的是气候。'},
],
};

const U={
s4a1:{name:'动物王国',desc:'四年级上册 · 第一单元',c:'#f0a878',topics:['动物分类','鱼类','鸟类','哺乳类','珍稀动物']},
s4a2:{name:'运动竞技',desc:'四年级上册 · 第二单元',c:'#78c898',topics:['运动与位置','运动形式','运动快慢']},
s4a3:{name:'力学工坊',desc:'四年级上册 · 第三单元',c:'#a090c8',topics:['力与运动','弹力','摩擦力','浮力']},
s4a4:{name:'电路实验室',desc:'四年级上册 · 第四单元',c:'#70a8d8',topics:['电路组成','导体与绝缘体','电路暗箱','生活中的电']},
s3b1:{name:'植物乐园',desc:'三年级下册 · 第一二单元',c:'#e898a8',topics:['种子发芽','根茎叶','开花传粉','植物结果','环境适应']},
s3b2:{name:'声音探秘',desc:'三年级下册 · 第三单元',c:'#e0c860',topics:['声音产生','声音传播','耳朵结构','音调与音量']},
s3b3:{name:'材料工坊',desc:'三年级下册 · 第四单元',c:'#e8a860',topics:['天然与人造','纸','金属','塑料']},
s3b4:{name:'气象站',desc:'三年级下册 · 第五单元',c:'#c098d0',topics:['测量气温','云量与雨量','风向与风力','天气与气候']},
}[uid];
if(!U){document.getElementById('main').innerHTML='<div class="result"><div class="result-icon">❓</div><div class="result-title">未找到单元</div><a class="btn" href="index.html">回首页</a></div>';throw 0}

const ALLQ=Q[uid];
document.getElementById('uname').textContent=U.name;
document.getElementById('udesc').textContent=U.desc;
document.title=U.name+' - 闯关';

let ti=0,tc=0,tt=0,combo=0;

// ==================== 音效系统（Web Audio API） ====================
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type='square',vol=.12,delay=0){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+delay+dur);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur);
}
function sfxCorrect(){AC.resume();playTone(660,.1,'square',.1,0);playTone(880,.15,'square',.1,.08)}
function sfxWrong(){AC.resume();for(var i=0;i<4;i++)playTone(400-i*100,.08,'square',.1,i*.06)}
function sfxCombo(){AC.resume();playTone(523,.08,'square',.1,0);playTone(659,.08,'square',.1,.07);playTone(784,.08,'square',.1,.14);playTone(1047,.15,'square',.12,.2)}
function sfxWin(){AC.resume();playTone(523,.12,'square',.1,0);playTone(659,.12,'square',.1,.1);playTone(784,.12,'square',.1,.2);playTone(1047,.25,'square',.12,.3)}

function saveToReview(q,uid){var r=JSON.parse(localStorage.getItem('sci_review')||'[]');var exists=r.find(function(x){return x.uid===uid&&x.t===q.t&&x.q===q.q});if(!exists){r.push({uid:uid,t:q.t,q:q.q,o:q.o,a:q.a,e:q.e||'',lvl:0,next:new Date().toDateString()});localStorage.setItem('sci_review',JSON.stringify(r))}}
function updateBar(){document.getElementById('pfill').style.width=(ti/U.topics.length*100)+'%';document.getElementById('ptext').textContent=ti+' / '+U.topics.length+' 课'}

function showTopic(){
  // 自动跳到未完成的课时
  const pr=JSON.parse(localStorage.getItem('sci_prog')||'{}');
  if(pr[uid]&&pr[uid].c>0){
    ti=Math.min(pr[uid].c,U.topics.length-1);
    // 如果最后一课已完成，直接显示结果
    if(pr[uid].c>=U.topics.length){showResult();return}
  }
  if(ti>=U.topics.length){showResult();return}
  updateBar();
  const qs=ALLQ.filter(q=>q.t===ti);
  for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}
  const picked=qs.slice(0,Math.min(5,qs.length));
  tc=0;tt=picked.length;

  document.getElementById('main').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:center;min-height:50vh">
      <div class="card" style="text-align:center;max-width:500px">
        <div class="card-title" style="justify-content:center"><span class="dot" style="background:${U.c}"></span>${U.topics[ti]}</div>
        <div style="font-size:15px;color:#8a7060;margin-bottom:16px">共 ${tt} 题 · 第 ${ti+1}/${U.topics.length} 课</div>
        ${ti>0?`<div style="font-size:13px;color:#a09080;margin-bottom:12px">已完成 ${ti} 课，继续加油！</div>`:''}
        <button class="btn" id="start-btn">开始答题 →</button>
      </div>
    </div>
  `;
  document.getElementById('start-btn').onclick=()=>runQuiz(picked);
}

function runQuiz(qs){
  let qi=0,ok=0;
  function renderQ(){
    if(qi>=qs.length){tc=ok;return finishTopic();}
    const q=qs[qi];
    document.getElementById('main').innerHTML=`
      <div class="quiz">
        <div class="quiz-header"><span class="quiz-num">第${qi+1}/${qs.length}题</span><span class="quiz-combo${combo>=2?' on':''}" id="cbo">🔥 ${combo}连击</span></div>
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts" id="opts-${qi}">${q.o.map((o,i)=>`<button class="quiz-opt" data-idx="${i}">${'ABCD'[i]}. ${o}</button>`).join('')}</div>
        <div class="feedback" id="fb-${qi}"></div>
        <div class="next-btn" id="next-${qi}"><button class="btn sm">下一题 →</button></div>
      </div>
    `;
    const opts=document.getElementById('opts-'+qi);
    const fb=document.getElementById('fb-'+qi);
    const next=document.getElementById('next-'+qi);
    const btns=opts.querySelectorAll('.quiz-opt');
    btns.forEach(b=>{b.onclick=function(){
      const idx=parseInt(this.dataset.idx);
      btns.forEach(bb=>bb.classList.add('chosen'));
      if(idx===q.a){this.classList.add('correct');fb.className='feedback fb-ok';fb.innerHTML='✅ 正确！'+(q.e?'<br><span style="font-size:13px;font-weight:400;margin-top:4px;display:inline-block">📖 '+q.e+'</span>':'');ok++;combo++;tc=ok;totalC++;sfxCorrect();if(combo%3===0)sfxCombo()}else{this.classList.add('wrong');btns[q.a].classList.add('correct');fb.className='feedback fb-no';fb.innerHTML='❌ 正确答案是 '+String.fromCharCode(65+q.a)+(q.e?'<br><span style="font-size:13px;font-weight:400;margin-top:4px;display:inline-block">📖 '+q.e+'</span>':'');combo=0;sfxWrong();saveToReview(q,uid)}
      totalQ++;
      if(combo>=3){const fc=document.getElementById('fcombo');fc.textContent='🔥 '+combo+'连击！';fc.className='float-combo pop';setTimeout(()=>fc.className='float-combo',800)}
      document.getElementById('cbo').textContent=combo>=2?'🔥 '+combo+'连击':'';document.getElementById('cbo').className='quiz-combo'+(combo>=2?' on':'');
      next.className='next-btn show';
    }});
    next.querySelector('button').onclick=()=>{qi++;renderQ()};
  }
  renderQ();
}

let totalC=0,totalQ=0;
function finishTopic(){
  sfxWin();
  const stars=Math.round(tc/tt*3);
  const pr=JSON.parse(localStorage.getItem('sci_prog')||'{}');
  if(!pr[uid])pr[uid]={c:0,s:0};
  pr[uid].c=Math.max(pr[uid].c,ti+1);
  pr[uid].s=Math.max(0,(pr[uid].s||0)+stars);
  localStorage.setItem('sci_prog',JSON.stringify(pr));
  // 徽章解锁检测
  if(pr[uid].c>=U.topics.length){
    var pending=JSON.parse(localStorage.getItem('sci_pending')||'[]');
    var badgeId=uid+'-master';
    if(pending.indexOf(badgeId)===-1){pending.push(badgeId);localStorage.setItem('sci_pending',JSON.stringify(pending))}
  }

  document.getElementById('main').innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:48px;margin-bottom:8px">${['😐','🙂','😊','🤩'][stars]}</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:4px">${U.topics[ti]} 完成</div>
      <div style="font-size:15px;color:#8a7060;margin-bottom:8px">正确 ${tc}/${tt} · ${stars}⭐</div>
      <div style="font-size:44px;letter-spacing:4px;margin-bottom:16px">${'⭐'.repeat(stars)+'☆'.repeat(3-stars)}</div>
      <button class="btn" id="next-topic">${ti+1<U.topics.length?'下一课 →':'查看总结'}</button>
    </div>
  `;
  document.getElementById('next-topic').onclick=()=>{ti++;showTopic()};
}

function showResult(){
  ti=U.topics.length;updateBar();
  const pct=Math.round(totalC/Math.max(1,totalQ)*100),emoji=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'👍':'💪';
  document.getElementById('main').innerHTML=`
    <div class="result">
      <div class="result-icon">${emoji}</div>
      <div class="result-title">${U.name} 闯关完成！</div>
      <div class="result-score">答对 ${totalC}/${totalQ} 题 · 正确率 ${pct}%</div>
      <div class="result-stars">${'⭐'.repeat(Math.max(1,Math.round(pct/100*5)))}</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn" href="level.html?unit=${uid}">🔄 再闯一次</a>
        <a class="btn secondary" href="index.html">🏠 回首页</a>
      </div>
    </div>
  `;
  updateBar();
}

showTopic();
</script>
</body>
</html>

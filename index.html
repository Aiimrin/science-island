<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>科学闯关岛</title>
<style>
@font-face{font-family:'PxFont';src:url('JinzisheBianzheng-Regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:'PxFont';src:url('JinzisheBianzheng-Regular.ttf') format('truetype');font-weight:700}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  width:100vw;height:100vh;height:100dvh;overflow:hidden;
  font-family:'PxFont','SimSun','PingFang SC','Microsoft YaHei',monospace;
  background:#fef9f0;user-select:none;-webkit-user-select:none;
  cursor:grab;-webkit-tap-highlight-color:transparent;touch-action:none;
  image-rendering:pixelated;-webkit-font-smoothing:none;
}
body:active{cursor:grabbing}
#map-canvas{position:absolute;inset:0;image-rendering:pixelated}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto}
.title-img{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:10;width:min(55vw,230px);height:auto;image-rendering:pixelated;pointer-events:none}
.top-bar{position:absolute;top:22px;left:14px;right:14px;z-index:10;display:flex;justify-content:space-between}
.top-btn{
  padding:8px 18px;border:2px solid #c8b898;background:rgba(255,252,246,.9);
  color:#5a4030;font-size:22px;font-weight:700;cursor:pointer;
  box-shadow:2px 2px 0 rgba(120,90,50,.12);transition:all .1s;
  display:flex;align-items:center;gap:5px;font-family:inherit;
}
.top-btn:hover{background:#fffdf8;transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(120,90,50,.18)}
.top-btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(120,90,50,.12)}
.btn-group{display:flex;gap:8px}
.badge-dot{display:none;position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#f0c040;border:2px solid #fff;animation:dPulse 1.5s ease-in-out infinite}
.badge-dot.on{display:inline-block}
@keyframes dPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
#badge-btn{position:relative}
.review-banner{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;
  padding:9px 20px;border:2px solid #d4a860;background:rgba(255,252,246,.92);
  color:#b08040;font-size:22px;font-weight:700;font-family:inherit;
  box-shadow:2px 2px 0 rgba(180,130,60,.15);
  display:flex;align-items:center;gap:8px;cursor:pointer;
  animation:bP 3s ease-in-out infinite;
}
@keyframes bP{0%,100%{box-shadow:2px 2px 0 rgba(180,130,60,.15)}50%{box-shadow:2px 2px 0 rgba(180,130,60,.3)}}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal{background:#fffdf8;border:3px solid #c8b898;padding:26px 22px 18px;max-width:400px;width:92%;box-shadow:4px 4px 0 rgba(120,90,50,.15);position:relative;max-height:85vh;overflow-y:auto}
.modal-icon{font-size:52px;text-align:center;margin-bottom:8px}
.modal-title{font-size:32px;font-weight:700;color:#5a4030;text-align:center}
.modal-subtitle{font-size:18px;color:#9a8070;text-align:center;margin-bottom:16px}
.modal-section{background:#fdf6ed;border:2px solid rgba(0,0,0,.04);padding:16px 18px;margin-bottom:14px}
.modal-section h4{font-size:22px;font-weight:700;color:#5a4030;margin-bottom:10px}
.modal-topic{display:inline-block;padding:6px 13px;border:2px solid rgba(0,0,0,.06);font-size:18px;font-weight:600;margin:3px 5px 3px 0;color:#5a4030;background:#fffdf8}
.modal-stats{display:flex;gap:12px;margin-bottom:18px}
.modal-stat{flex:1;text-align:center;padding:12px 6px;border:2px solid rgba(0,0,0,.04);background:#fdf6ed}
.modal-stat .num{font-size:32px;font-weight:700}.modal-stat .lbl{font-size:16px;color:#9a8070;margin-top:3px}
.modal-progress-bar{height:10px;border:2px solid rgba(0,0,0,.08);background:#f0e8d8;margin-bottom:6px}
.modal-progress-fill{height:100%;transition:width .5s step-end}
.modal-progress-text{font-size:16px;color:#9a8070;text-align:right;margin-bottom:18px}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:14px 16px;border:2px solid #c8b898;font-size:24px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 rgba(120,90,50,.12);transition:all .1s}
.modal-btn.primary{background:#e0b860;color:#fff;border-color:#c89840}.modal-btn.primary:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(120,90,50,.18)}
.modal-btn.secondary{background:#fffdf8;color:#5a4030}.modal-btn.secondary:hover{background:#fdf6ed}
.modal-close{position:absolute;top:10px;right:12px;width:26px;height:26px;border:2px solid rgba(0,0,0,.08);background:#fffdf8;color:#9a8070;font-size:16px;cursor:pointer;font-weight:700}
@media(max-width:640px){.top-btn{padding:6px 10px;font-size:16px}.btn-group{flex-direction:column;gap:6px}.title-img{width:min(40vw,150px)}.review-banner{font-size:18px;padding:8px 16px;bottom:16px}.modal{padding:20px 15px 14px}}
</style>

<body>
<audio id="bgm" src="Spring_Wild_Horseradish_Jam.mp3" autoplay loop volume="0.18"></audio>
<script>(function(){var a=document.getElementById('bgm');var t=parseFloat(localStorage.getItem('bgm_t')||'0');if(t>0)a.currentTime=t;a.play();setInterval(function(){localStorage.setItem('bgm_t',a.currentTime)},300);window.addEventListener('beforeunload',function(){localStorage.setItem('bgm_t',a.currentTime)});document.addEventListener('click',function p(){if(a.paused){a.currentTime=parseFloat(localStorage.getItem('bgm_t')||'0');a.play()}document.removeEventListener('click',p)},{once:true});})();</script>
<canvas id="map-canvas"></canvas>
<div id="overlay">
  <img class="title-img" src="title.png" alt="科学闯关岛" draggable="false">
  <div class="top-bar">
    <div class="btn-group">
      <button class="top-btn" onclick="openBadges()" id="badge-btn">🏆 徽章<span class="badge-dot" id="badge-dot"></span></button>
      <button class="top-btn" onclick="openReview()">📝 复习</button>
    </div>
    <div class="btn-group">
      <button class="top-btn" onclick="toggleHelp()">?</button>

    </div>
  </div>
  <div class="review-banner" onclick="openReview()"><span style="display:inline-block;width:9px;height:9px;background:#d4a860;animation:dB 1s step-end infinite"></span> 今日 <b id="review-count">3</b> 道错题待复习 <span style="opacity:.6">></span></div>
</div>
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal()">X</button>
    <div class="modal-icon" id="modal-icon"></div><div class="modal-title" id="modal-title"></div><div class="modal-subtitle" id="modal-subtitle"></div>
    <div class="modal-section" id="modal-topics"></div><div class="modal-stats" id="modal-stats"></div>
    <div class="modal-progress-bar"><div class="modal-progress-fill" id="modal-progress-fill"></div></div>
    <div class="modal-progress-text" id="modal-progress-text"></div>
    <div class="modal-btns">
      <button class="modal-btn primary" onclick="startLevels()">🎮 闯关</button>
      <button class="modal-btn secondary" onclick="startLab()">🧪 实验</button>
    </div>
    <div style="margin-top:8px"><button class="modal-btn secondary" onclick="startTree()" style="width:100%">🌳 知识树</button></div>
  </div>
</div>
<style>@keyframes dB{0%,100%{opacity:1}50%{opacity:.3}}</style>

<script>
// ==================== 岛屿数据 ====================
const IS=[
  {id:'s4a1',n:'动物王国',sem:'四年级上册',unit:'第一单元',icon:'🐾',c:'#f0a878',cd:'#c87850',cs:'#e09060',cg:'#8cbc50',cw:'#d88848',shape:'paw',
   topics:[{n:'动物分类',k:'脊椎 vs 无脊椎；按特征归类'},{n:'鱼类',k:'鳃呼吸、鳍运动；变温脊椎动物'},{n:'鸟类',k:'羽毛、恒温、卵生；正羽防水绒羽保温'},{n:'哺乳类',k:'皮毛+脂肪保温、恒温、胎生哺乳'},{n:'珍稀动物',k:'朱鹮、大熊猫、扬子鳄；《野生动物保护法》'}]},
  {id:'s4a2',n:'运动竞技',sem:'四年级上册',unit:'第二单元',icon:'🏎️',c:'#78c898',cd:'#489868',cs:'#58b878',cg:'#68d8a8',cw:'#388858',shape:'track',
   topics:[{n:'运动与位置',k:'参照物；位置=方向+距离'},{n:'运动形式',k:'直线/曲线运动；摆动/振动/旋转'},{n:'运动快慢',k:'速度=路程÷时间；速度大冲击力大'}]},
  {id:'s4a3',n:'力学工坊',sem:'四年级上册',unit:'第三单元',icon:'⚡',c:'#a090c8',cd:'#7060a0',cs:'#9080b8',cg:'#b0a0d8',cw:'#605090',shape:'gear',
   topics:[{n:'力与运动',k:'力改变运动状态；拉力越大小车越快'},{n:'弹力',k:'拉力与弹簧伸长成正比；弹簧测力计'},{n:'摩擦力',k:'接触面粗糙度影响摩擦力；流线型减阻'},{n:'浮力',k:'竖直向上；体积和质量共同决定沉浮'}]},
  {id:'s4a4',n:'电路实验室',sem:'四年级上册',unit:'第四单元',icon:'💡',c:'#70a8d8',cd:'#3870a8',cs:'#5898c8',cg:'#90c8e8',cw:'#286098',shape:'bulb',
   topics:[{n:'电路组成',k:'电源+用电器+导线+开关；闭合回路'},{n:'导体与绝缘体',k:'导体=铁钉/铅笔芯/盐水；绝缘体=塑料'},{n:'电路暗箱',k:'亮=连通；变亮=加电池；变暗=加用电器'},{n:'生活中的电',k:'直流(电池) vs 交流(发电厂)；安全用电'}]},
  {id:'s3b1',n:'植物乐园',sem:'三年级下册',unit:'第一二单元',icon:'🌱',c:'#e898a8',cd:'#b86878',cs:'#d88898',cg:'#f8b8c8',cw:'#a85868',shape:'flower',
   topics:[{n:'种子发芽',k:'需水分+空气+适宜温度'},{n:'根茎叶',k:'根吸收固定；茎输送；叶光合作用'},{n:'开花传粉',k:'虫媒/风媒/自花/人工辅助'},{n:'植物结果',k:'果实=果皮+种子；植物的一生'},{n:'环境适应',k:'沙漠/水生/石上植物的适应本领'}]},
  {id:'s3b2',n:'声音探秘',sem:'三年级下册',unit:'第三单元',icon:'🔊',c:'#e0c860',cd:'#a89830',cs:'#d0b850',cg:'#f0d870',cw:'#988820',shape:'wave',
   topics:[{n:'声音产生',k:'物体振动产生声音'},{n:'声音传播',k:'气体/液体/固体均可传声；真空不能'},{n:'耳朵结构',k:'耳郭→外耳道→鼓膜→听小骨→耳蜗→听神经'},{n:'音调·音量',k:'音量=强弱(幅度)；音调=高低(长短)'}]},
  {id:'s3b3',n:'材料工坊',sem:'三年级下册',unit:'第四单元',icon:'🧱',c:'#e8a860',cd:'#b07830',cs:'#d89850',cg:'#f8b870',cw:'#a06828',shape:'blocks',
   topics:[{n:'天然vs人造',k:'木材/棉花/羊毛=天然；纸/玻璃/塑料=人造'},{n:'纸',k:'蔡伦造纸术；不同纸吸水性和结实度不同'},{n:'金属',k:'有光泽/导热/延展性；合金优于单一金属'},{n:'塑料',k:'轻便防水不易降解→"白色污染"'}]},
  {id:'s3b4',n:'气象站',sem:'三年级下册',unit:'第五单元',icon:'🌈',c:'#c098d0',cd:'#8868a0',cs:'#b088c0',cg:'#d0a8e0',cw:'#785890',shape:'cloud',
   topics:[{n:'测量气温',k:'百叶箱：通风/白色/草坪/朝北/1.5m'},{n:'云量与雨量',k:'晴/多云/阴；雨量器(毫米)'},{n:'风向与风力',k:'风向=风吹来的方向；风级歌0-12级'},{n:'天气与气候',k:'天气=短期变化；气候=长期规律'}]},
];

// ==================== 网格布局 ====================
const PAD_TOP=60;
function isMobile(){return window.innerWidth<700}
function cellSize(){
  if(isMobile()){const w=Math.min(200,window.innerWidth/2);return{w:w,h:Math.round(w*.82)}}
  return{w:360,h:280};
}
function layoutGrid(){
  const cols=isMobile()?2:4;
  const cs=cellSize();
  const rows=Math.ceil(IS.length/cols);
  const totalW=cols*cs.w,totalH=rows*cs.h+PAD_TOP;
  IS.forEach((is,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    is.gx=col*cs.w+cs.w/2;is.gy=PAD_TOP+row*cs.h+cs.h/2;
  });
  return{cols,rows,totalW,totalH};
}

let grid;
function relayout(){grid=layoutGrid()}
relayout();

let offsetX=0,offsetY=0;
function clampOffset(){
  const maxOX=Math.max(0,grid.totalW-W);
  const maxOY=Math.max(0,grid.totalH-H);
  offsetX=Math.max(0,Math.min(maxOX,offsetX));
  offsetY=Math.max(0,Math.min(maxOY,offsetY));
}

let drag=false,dsx=0,dsy=0,ox0=0,oy0=0,hov=null,aid=null,time=0;
let prog;try{prog=JSON.parse(localStorage.getItem('sci_prog')||'{}')}catch{prog={}}
IS.forEach(i=>{if(!prog[i.id])prog[i.id]={c:0,s:0}});

const cv=document.getElementById('map-canvas'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;relayout();clampOffset()}
rs();window.addEventListener('resize',rs);
window.addEventListener('orientationchange',()=>setTimeout(rs,300));

// ==================== 绘制 ====================
function drawBg(){
  // 温馨暖黄小屋背景
  const g=ctx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.6,Math.max(W,H)*.85);
  g.addColorStop(0,'#fffdf6');
  g.addColorStop(.4,'#fef9ec');
  g.addColorStop(.75,'#fdf3de');
  g.addColorStop(1,'#f8e8c8');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // 墙壁纹理——淡淡的横条纹
  ctx.fillStyle='rgba(220,200,170,.06)';
  for(let y=0;y<H;y+=18)ctx.fillRect(0,y,W,1);
  // 角落装饰光斑
  const spots=[
    [.12,.15,.3,'rgba(255,240,210,.18)'],
    [.88,.2,.25,'rgba(255,238,200,.14)'],
    [.08,.8,.22,'rgba(255,242,215,.12)'],
  ];
  spots.forEach(([rx,ry,rr,clr])=>{
    const sg=ctx.createRadialGradient(W*rx,H*ry,0,W*rx,H*ry,W*Math.max(W,H)*rr/800);
    sg.addColorStop(0,clr);sg.addColorStop(1,'transparent');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
  });
}

// 像素装饰——飘浮的小星星
const stars=[];
for(let i=0;i<30;i++)stars.push({x:Math.random()*3200,y:Math.random()*2000,p:Math.random()*Math.PI*2,s:.3+Math.random()*.5});
function drawDecor(){
  ctx.imageSmoothingEnabled=false;
  stars.forEach(s=>{
    const a=.08+.06*Math.sin(time*s.s+s.p);
    ctx.fillStyle=`rgba(200,180,140,${a})`;
    const sx=s.x-offsetX,sy=s.y-offsetY;
    ctx.fillRect(sx,sy,2,2);
    // 十字星芒
    ctx.fillStyle=`rgba(200,180,140,${a*.4})`;
    ctx.fillRect(sx-1,sy,4,1);ctx.fillRect(sx,sy-1,1,4);
  });
}

// ==================== 岛屿 ====================
function pxs(x,y){ctx.fillStyle='rgba(50,25,8,.1)';ctx.fillRect(x-72,y+10,144,16)}
function paw(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-66,y-12,132,28);ctx.fillStyle=cw;ctx.fillRect(x-66,y-12,132,6);
  ctx.fillStyle=cs;ctx.fillRect(x-63,y-15,126,24);ctx.fillStyle=cg;ctx.fillRect(x-66,y-15,132,7);
  ctx.fillStyle='#7ab838';ctx.fillRect(x-63,y-17,126,5);
  ctx.fillStyle='#c89860';ctx.fillRect(x-23,y-56,46,36);ctx.fillStyle='#e0b880';ctx.fillRect(x-19,y-52,38,28);
  ctx.fillStyle='#8b5a30';ctx.fillRect(x-23,y-56,46,6);ctx.fillStyle='#6b3a18';ctx.fillRect(x-3,y-46,10,15);
  ctx.fillStyle='#b8e0f8';ctx.fillRect(x-16,y-46,8,8);ctx.fillRect(x+9,y-46,8,8);
  [[-50,-40],[38,-34]].forEach(([tx,ty])=>{ctx.fillStyle='#5a8a20';ctx.fillRect(x+tx-8,y+ty,22,20);ctx.fillStyle='#8b5a30';ctx.fillRect(x+tx,y+ty+17,6,14)});
}
function track(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-70,y-10,140,24);ctx.fillStyle=cw;ctx.fillRect(x-70,y-10,140,5);
  ctx.fillStyle=cs;ctx.fillRect(x-68,y-12,136,20);ctx.fillStyle=cg;ctx.fillRect(x-70,y-12,140,6);
  ctx.fillStyle='#d0c0a0';ctx.fillRect(x-62,y-22,124,12);
  [{dx:-24,dy:-28,clr:'#e84040'},{dx:16,dy:-30,clr:'#4060e8'}].forEach(car=>{ctx.fillStyle=car.clr;ctx.fillRect(x+car.dx,y+car.dy,17,10);ctx.fillStyle='#fff';ctx.fillRect(x+car.dx+1,y+car.dy-1,12,6);ctx.fillStyle='#222';ctx.fillRect(x+car.dx+2,y+car.dy+7,6,3);ctx.fillRect(x+car.dx+14,y+car.dy+7,4,3)});
  ctx.fillStyle='#f8f8f8';ctx.fillRect(x-64,y-34,3,28);
  for(let r=0;r<4;r++){ctx.fillStyle=r%2?'#111':'#fff';ctx.fillRect(x-61,y-34+r*6,12,6)}
}
function gear(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-58,y-10,116,22);ctx.fillStyle=cs;ctx.fillRect(x-56,y-12,112,18);
  ctx.fillStyle=cg;ctx.fillRect(x-58,y-12,116,5);
  ctx.fillStyle=c;ctx.fillRect(x-24,y-48,48,38);ctx.fillStyle=cd;ctx.fillRect(x-22,y-46,44,34);
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2-Math.PI/2;const px=Math.round(Math.cos(a)*32),py=Math.round(Math.sin(a)*30);ctx.fillStyle=c;ctx.fillRect(x+px-7,y-26+py-6,14,12)}
  ctx.fillStyle=cd;ctx.fillRect(x-10,y-32,20,20);
  ctx.fillStyle='#c0c0c0';ctx.fillRect(x+36,y-38,12,14);ctx.fillStyle='#e0e0e0';ctx.fillRect(x+37,y-39,10,5);
}
function bulb(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-46,y-10,92,22);ctx.fillStyle=cs;ctx.fillRect(x-44,y-12,88,18);
  ctx.fillStyle=cg;ctx.fillRect(x-46,y-12,92,5);
  ctx.fillStyle=cs;ctx.fillRect(x-25,y-56,50,42);ctx.fillStyle=c;ctx.fillRect(x-23,y-58,46,38);
  ctx.fillStyle='#fff8c0';ctx.fillRect(x-10,y-46,20,20);
  ctx.fillStyle=cd;ctx.fillRect(x-10,y-16,20,10);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x-12,y-6,24,7);
  for(let i=0;i<5;i++){ctx.fillStyle=`rgba(255,248,192,${.5+.3*Math.sin(time*4+i)})`;ctx.fillRect(x-17+i*10,y-38+Math.sin(time*5+i)*3,3,3)}
}
function flower(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-62,y-10,124,22);ctx.fillStyle=cs;ctx.fillRect(x-60,y-12,120,18);
  ctx.fillStyle=cg;ctx.fillRect(x-62,y-12,124,5);ctx.fillStyle='#7ab838';ctx.fillRect(x-60,y-14,120,4);
  [{dx:-32,dy:-42},{dx:-10,dy:-48},{dx:12,dy:-38},{dx:30,dy:-44},{dx:-22,dy:-26},{dx:4,dy:-32},{dx:26,dy:-24}].forEach(p=>{ctx.fillStyle=cd;ctx.fillRect(x+p.dx-8,y+p.dy-8,17,17);ctx.fillStyle=c;ctx.fillRect(x+p.dx-6,y+p.dy-6,12,12)});
  ctx.fillStyle='#f8d860';ctx.fillRect(x-5,y-34,17,17);ctx.fillStyle='#6a5020';ctx.fillRect(x-1,y-31,6,6);
  ctx.fillStyle='#5a8a20';ctx.fillRect(x+1,y-18,5,12);
  for(let fx=x-48;fx<x+30;fx+=11){ctx.fillStyle='#c89860';ctx.fillRect(fx,y-10,4,18);ctx.fillStyle='#e0c090';ctx.fillRect(fx-1,y-10,7,3)}
}
function wave(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-54,y-10,108,22);ctx.fillStyle=cs;ctx.fillRect(x-52,y-12,104,18);
  ctx.fillStyle=cg;ctx.fillRect(x-54,y-12,108,5);
  ctx.fillStyle='#b0b0b0';ctx.fillRect(x-3,y-58,10,44);
  ctx.fillStyle=cs;ctx.fillRect(x-6,y-60,16,7);ctx.fillStyle=c;ctx.fillRect(x-5,y-61,13,3);
  for(let r=0;r<6;r++){ctx.strokeStyle=[c,cd,cs,c,cs,cg][r]+'cc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-32,(r+1)*12,-.55,.55);ctx.stroke()}
  ctx.fillStyle=c;ctx.fillRect(x-30,y-42,6,20);ctx.fillRect(x-38,y-26,8,8);
  ctx.fillStyle=cd;ctx.fillRect(x+34,y-38,6,16);ctx.fillRect(x+28,y-26,8,7);
}
function blocks(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-56,y-8,112,20);ctx.fillStyle=cs;ctx.fillRect(x-54,y-10,108,16);
  [{dx:-20,dy:-60,w:26,h:16},{dx:6,dy:-58,w:28,h:16},{dx:-30,dy:-42,w:22,h:16},{dx:10,dy:-40,w:20,h:16},{dx:-12,dy:-26,w:44,h:16}].forEach(b=>{ctx.fillStyle=cd;ctx.fillRect(x+(b.dx-1),y+(b.dy-1),b.w+2,b.h+2);ctx.fillStyle=c;ctx.fillRect(x+b.dx,y+b.dy,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x+b.dx,y+b.dy,b.w,3)});
  ctx.fillStyle='#c0c0c0';ctx.fillRect(x+36,y-20,4,22);ctx.fillStyle='#808080';ctx.fillRect(x+28,y-30,20,10);
}
function cloud(x,y,c,cd,cs,cg,cw){
  pxs(x,y);
  ctx.fillStyle=cd;ctx.fillRect(x-48,y-8,96,20);ctx.fillStyle=cs;ctx.fillRect(x-46,y-10,92,16);
  [{dx:-16,dy:-42,w:36,h:24},{dx:8,dy:-48,w:44,h:30},{dx:28,dy:-40,w:32,h:22},{dx:-6,dy:-22,w:28,h:18},{dx:12,dy:-18,w:26,h:16}].forEach(p=>{ctx.fillStyle=cd;ctx.fillRect(x+(p.dx-1),y+(p.dy-1),p.w+2,p.h+2);ctx.fillStyle=c;ctx.fillRect(x+p.dx,y+p.dy,p.w,p.h);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x+p.dx+p.w*.15,y+p.dy+p.h*.1,p.w*.22,p.h*.18)});
  for(let i=0;i<3;i++){ctx.fillStyle='#80c8f0';ctx.fillRect(x-10+i*9,y+20+Math.sin(time*5+i)*3,2,7)}
  ctx.fillStyle='#f8f8f8';ctx.fillRect(x+38,y-38,5,28);ctx.fillStyle='#e84040';ctx.fillRect(x+39,y-22,3,16);
}

const SF={paw,track,gear,bulb,flower,wave,blocks,cloud};

function drawIslands(){
  ctx.imageSmoothingEnabled=false;
  IS.forEach(is=>{
    const sx=is.gx-offsetX,sy=is.gy-offsetY;
    if(sx<-120||sx>W+120||sy<-120||sy>H+120)return;
    const ho=hov===is.id,pr=prog[is.id],pct=pr?Math.min(1,pr.c/is.topics.length):0;
    const mob=isMobile(),sc=mob?cellSize().w/360:1;
    ctx.save();ctx.translate(sx,sy);
    ctx.scale(sc,sc);
    SF[is.shape](0,0,is.c,is.cd,is.cs,is.cg,is.cw);
    if(pct>0&&pct<1){ctx.strokeStyle=is.c;ctx.lineWidth=6;ctx.strokeRect(-88,-78,176,132)}else if(pct>=1){ctx.strokeStyle='#e8c050';ctx.lineWidth=6;ctx.strokeRect(-88,-78,176,132)}
    if(ho){ctx.fillStyle='rgba(255,240,200,.22)';ctx.fillRect(-92,-84,184,142)}
    // 标签——无背景无emoji
    const ls=mob?1:.82,fs=Math.round(mob?48:48/.82);
    ctx.scale(ls,ls);
    ctx.font=`bold ${fs}px PxFont,SimSun,monospace`;ctx.fillStyle='#5a4030';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(is.n,0,64);
    ctx.font=`${Math.round(fs*.5)}px PxFont,SimSun,monospace`;ctx.fillStyle='#a09078';
    ctx.fillText(is.sem,0,64+fs*1.6);
    ctx.restore();
  });
}

function render(now){
  time=now*.001;
  drawBg();drawDecor();drawIslands();
  requestAnimationFrame(render);
}

// ==================== 交互 ====================
cv.addEventListener('mousedown',e=>{drag=true;dsx=e.clientX;dsy=e.clientY;ox0=offsetX;oy0=offsetY});
window.addEventListener('mousemove',e=>{
  if(drag){
    offsetX=ox0-(e.clientX-dsx);
    clampOffset();hov=null;
  }else{
    const mx=e.clientX+offsetX,my=e.clientY+offsetY;
    const f=IS.find(i=>Math.abs(mx-i.gx)<140&&Math.abs(my-i.gy)<130);
    hov=f?f.id:null;cv.style.cursor=hov?'pointer':'grab';
  }
});
window.addEventListener('mouseup',()=>{drag=false});

cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;dsx=e.touches[0].clientX;dsy=e.touches[0].clientY;ox0=offsetX;oy0=offsetY}
  else{drag=false}
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(drag&&e.touches.length===1){
    if(isMobile()){offsetY=oy0-(e.touches[0].clientY-dsy)}
    else{offsetX=ox0-(e.touches[0].clientX-dsx)}
    clampOffset();
  }
},{passive:false});
cv.addEventListener('touchend',()=>{drag=false});

cv.addEventListener('click',e=>{if(Math.abs(e.clientX-dsx)>4||Math.abs(e.clientY-dsy)>4)return;if(hov)openModal(hov)});

// ==================== 弹窗 ====================
function openModal(id){
  const is=IS.find(i=>i.id===id);aid=id;const pr=prog[id],pct=pr?Math.round((pr.c/is.topics.length)*100):0;
  document.getElementById('modal-icon').textContent=is.icon;document.getElementById('modal-title').textContent=is.n;document.getElementById('modal-subtitle').textContent=is.sem+' · '+is.unit;
  document.getElementById('modal-topics').innerHTML='<h4>◆ 知识点</h4>'+is.topics.map((t,i)=>`<span class="modal-topic"${i<2?` style="background:${is.c};color:#fff;border-color:${is.cd}"`:''}>${t.n}</span>`).join('');
  document.getElementById('modal-stats').innerHTML=`<div class="modal-stat"><div class="num" style="color:${is.c}">${is.topics.length}</div><div class="lbl">知识点</div></div><div class="modal-stat"><div class="num" style="color:${is.c}">${pr.s||0}</div><div class="lbl">☆ 已获星</div></div><div class="modal-stat"><div class="num" style="color:${is.c}">${pr.c||0}</div><div class="lbl">已通关</div></div>`;
  const fill=document.getElementById('modal-progress-fill');fill.style.width=pct+'%';fill.style.background=is.c;
  document.getElementById('modal-progress-text').textContent=`掌握度 ${pct}% · ${pr.c||0}/${is.topics.length} 课`;
  document.querySelector('.modal-btn.primary').onclick=()=>startLv(id);document.querySelector('.modal-btn.secondary').onclick=()=>startLab(id);
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(e){if(e&&e.target!==document.getElementById('modal-overlay'))return;document.getElementById('modal-overlay').classList.remove('active');aid=null}
function startLv(id){location.href='level.html?unit='+(id||aid)}
function startLab(id){location.href='lab.html?unit='+(id||aid)}
function startTree(){location.href='tree.html?unit='+(aid)}
function openBadges(){location.href='badges.html'}
function openReview(){location.href='review.html'}
function toggleHelp(){alert('操作帮助\n\n🖱️ 桌面：横向拖拽\n👆 手机：纵向滑动\n🏝️ 点击岛屿进入学习')}
function clearProgress(){if(confirm('确定要清空所有学习进度吗？此操作不可恢复。')){localStorage.removeItem('sci_prog');localStorage.removeItem('sci_review');localStorage.removeItem('sci_review_graduate');localStorage.removeItem('sci_pending');localStorage.removeItem('sci_lab');progress={};IS.forEach(is=>{progress[is.id]={c:0,s:0}});document.getElementById('review-count').textContent='0';document.getElementById('badge-dot').classList.remove('on');alert('进度已清空！')}}
function resetView(){offsetX=0;offsetY=0}

(function(){var r=JSON.parse(localStorage.getItem('sci_review')||'[]');var today=new Date().toDateString();var due=r.filter(function(q){return new Date(q.next)<=new Date(today)}).length;document.getElementById('review-count').textContent=due||0;})();
function updateBadgeDot(){var p=JSON.parse(localStorage.getItem('sci_pending')||'[]');var d=document.getElementById('badge-dot');if(p.length>0)d.classList.add('on');else d.classList.remove('on')}updateBadgeDot();window.addEventListener('pageshow',updateBadgeDot);
requestAnimationFrame(render);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>徽章墙 - 科学闯关岛</title>
<style>
@font-face{font-family:'PxFont';src:url('JinzisheBianzheng-Regular.ttf') format('truetype');}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'PxFont','Microsoft YaHei','SimHei',sans-serif;background:#fef9f0;min-height:100vh;color:#4a3020;-webkit-font-smoothing:none;image-rendering:pixelated}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fffdf6;border-bottom:3px solid #c8b898;position:sticky;top:0;z-index:10}
.back-btn{width:40px;height:40px;border:2px solid #c8b898;background:#fdf6ed;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(120,90,50,.12);color:#4a3020}
h1{font-size:24px;font-weight:700}
.stats{padding:14px 16px;text-align:center;font-size:15px;color:#8a7060;background:#fdf6ed;border-bottom:2px solid rgba(0,0,0,.04)}
.stats strong{color:#d4a020;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px;max-width:800px;margin:0 auto}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}}
.badge-card{text-align:center;padding:18px 10px;border:3px solid #e0d8c8;background:#fffdf8;border-radius:6px;transition:all .3s;box-shadow:2px 2px 0 rgba(120,90,50,.08);position:relative;overflow:hidden;cursor:default}
.badge-card.locked{opacity:.45;filter:grayscale(1)}
.badge-card.unlocked{border-color:#d4a020}
.badge-card.pending{border-color:#e8c840;cursor:pointer;animation:pendingPulse 2s ease-in-out infinite}
.badge-card.pending:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(212,160,32,.2)}
@keyframes pendingPulse{0%,100%{box-shadow:2px 2px 0 rgba(120,90,50,.08)}50%{box-shadow:0 0 20px rgba(232,200,64,.3)}}
.badge-card.reveal{animation:reveal .5s ease-out}
@keyframes reveal{0%{transform:scale(1.1);border-color:#f0d050}100%{transform:scale(1);border-color:#d4a020}}
.badge-icon{width:56px;height:56px;margin:0 auto 10px;font-size:40px;line-height:56px;position:relative}
.badge-icon .frame{position:absolute;inset:-4px;border:2px solid rgba(0,0,0,.8);border-radius:4px;pointer-events:none}
.badge-card.unlocked .badge-icon .frame{border-color:#d4a020;box-shadow:0 0 8px rgba(212,160,32,.3)}
.badge-name{font-size:15px;font-weight:700;margin-bottom:2px}
.badge-unit{font-size:11px;color:#8a7060;margin-bottom:6px}
.badge-status{font-size:12px;font-weight:700}
.badge-status.got{color:#4a8020}.badge-status.lost{color:#b0a090}
.badge-status.pending{color:#c08020}
.pending-overlay{position:absolute;inset:0;background:rgba(255,248,220,.6);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#c08020;pointer-events:none}
.bgm-btn{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border:2px solid #c8b898;background:rgba(255,252,246,.9);font-size:22px;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(120,90,50,.12);transition:all .2s}
.bgm-btn.muted{opacity:.5}
/* 烟花粒子 */
.spark{position:fixed;pointer-events:none;z-index:200;font-size:24px;animation:sparkFly .8s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
/* 隐藏徽章 */
.badge-card.hidden{cursor:pointer}
.badge-card.hidden .badge-icon .frame{border-style:dashed}
.badge-card.hidden-ready{border-color:#e8c840;animation:hiddenPulse 1.8s ease-in-out infinite}
@keyframes hiddenPulse{0%,100%{box-shadow:2px 2px 0 rgba(120,90,50,.08)}50%{box-shadow:0 0 26px rgba(240,208,80,.55);border-color:#f0d050}}
.badge-card.hidden-reveal{animation:bigReveal .9s cubic-bezier(.34,1.56,.64,1)}
@keyframes bigReveal{0%{transform:scale(.4) rotate(-10deg);opacity:.3}60%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.hidden-name{letter-spacing:2px;color:#b8a880}
.ring{position:fixed;pointer-events:none;z-index:210;width:40px;height:40px;border:4px solid #f0d050;border-radius:50%;transform:translate(-50%,-50%);animation:ringExpand 1s ease-out forwards}
@keyframes ringExpand{0%{opacity:1;transform:translate(-50%,-50%) scale(.5);box-shadow:0 0 30px rgba(240,208,80,.8)}100%{opacity:0;transform:translate(-50%,-50%) scale(8);box-shadow:0 0 60px rgba(240,208,80,.4)}}
.flash{position:fixed;inset:0;z-index:205;background:radial-gradient(circle,rgba(255,240,180,.95),rgba(240,208,80,.45));opacity:0;pointer-events:none;animation:screenFlash .7s ease-out forwards}
@keyframes screenFlash{0%{opacity:.9}100%{opacity:0}}
</style>
</head>
<body>
<audio id="bgm" src="Spring_Wild_Horseradish_Jam.mp3" autoplay loop volume="0.18"></audio>
<script>(function(){var a=document.getElementById('bgm');function sv(){try{localStorage.setItem('bgm_t',String(a.currentTime||0));localStorage.setItem('bgm_ts',String(Date.now()))}catch(e){}}function sk(){var t=parseFloat(localStorage.getItem('bgm_t')||'0'),ts=parseFloat(localStorage.getItem('bgm_ts')||'0'),d=a.duration||0;if(t>0&&ts>0&&d>0){try{a.currentTime=(t+(Date.now()-ts)/1000)%d}catch(e){}}}function pl(){sk();var p=a.play();if(p&&p.catch)p.catch(function(){})}pl();if(a.readyState<1)a.addEventListener('loadedmetadata',pl,{once:true});setInterval(sv,250);window.addEventListener('pagehide',sv);window.addEventListener('beforeunload',sv);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')sv()});['pointerdown','touchstart','click'].forEach(function(ev){document.addEventListener(ev,function(){if(window.__bgmOff)return;if(a.paused)pl()},{passive:true})})})();</script>
<div class="top"><button class="back-btn" onclick="history.back()">←</button><h1>🏆 徽章墙</h1></div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"></div>
<button class="bgm-btn" id="bgm-btn" onclick="toggleBGM()" title="音乐">♫</button>

<script>
// ==================== 音效 ====================
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type,vol,delay){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+delay+dur);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur);
}
function sfxUnlock(){AC.resume();playTone(523,.1,'square',.1,0);playTone(659,.1,'square',.1,.08);playTone(784,.1,'square',.1,.16);playTone(1047,.2,'square',.12,.24);playTone(784,.15,'square',.1,.4);playTone(1047,.3,'square',.12,.5)}
function sfxClick(){AC.resume();playTone(880,.08,'square',.08,0)}
function sfxAllMaster(){AC.resume();[523,659,784,1047].forEach((f,i)=>playTone(f,.16,'square',.12,i*.12));playTone(1319,.45,'square',.14,.5)}
function sfxAllLab(){AC.resume();[392,494,587,784].forEach((f,i)=>playTone(f,.16,'triangle',.12,i*.12));playTone(988,.45,'triangle',.14,.5)}
function sfxAllBadges(){AC.resume();[523,659,784,1047,1319,1568].forEach((f,i)=>playTone(f,.2,'square',.13,i*.1));playTone(2093,.6,'square',.15,.6)}
function sfxHiddenUnlock(){AC.resume();[523,659,784,1047,1319,1568,2093].forEach((f,i)=>playTone(f,.18,'square',.12,i*.09));[1047,1319,1568].forEach((f,i)=>playTone(f,.4,'triangle',.13,.63+i*.1));playTone(2637,.55,'square',.14,.63)}

// ==================== 数据 ====================
const UNITS=[
  {id:'s4a1',name:'动物王国',sem:'四上',icon:'🐾',labIcon:'🦴'},{id:'s4a2',name:'运动竞技',sem:'四上',icon:'🏎️',labIcon:'🚌'},
  {id:'s4a3',name:'力学工坊',sem:'四上',icon:'⚡',labIcon:'⚖️'},{id:'s4a4',name:'电路实验室',sem:'四上',icon:'💡',labIcon:'🔋'},
  {id:'s3b1',name:'植物乐园',sem:'三下',icon:'🌱',labIcon:'🌻'},{id:'s3b2',name:'声音探秘',sem:'三下',icon:'🔊',labIcon:'🎸'},
  {id:'s3b3',name:'材料工坊',sem:'三下',icon:'🧱',labIcon:'🔨'},{id:'s3b4',name:'气象站',sem:'三下',icon:'🌈',labIcon:'🌡️'},
];
const BADGES=[{id:'master',name:'知识大师',desc:'闯关全部通关'},{id:'lab',name:'实验达人',desc:'实验室探索完成'}];

const pr=JSON.parse(localStorage.getItem('sci_prog')||'{}');
const labPr=JSON.parse(localStorage.getItem('sci_lab')||'{}');
const pending=JSON.parse(localStorage.getItem('sci_pending')||'[]');
let unlocked=0,total=UNITS.length*BADGES.length+2;
let masterCount=0,labCount=0,celMaster=false,celLab=false,celAll=false;

function isUnlocked(uid,bid){
  if(bid==='master')return (pr[uid]||{c:0}).c>=4;
  if(bid==='lab')return (labPr[uid]||{done:false}).done;
  return false;
}

const grid=document.getElementById('grid');
UNITS.forEach(u=>{
  BADGES.forEach(bt=>{
    const badgeKey=u.id+'-'+bt.id;
    const got=isUnlocked(u.id,bt.id);
    const isPending=pending.indexOf(badgeKey)!==-1;
    if(got&&!isPending){unlocked++;if(bt.id==='master')masterCount++;else labCount++}

    const card=document.createElement('div');
    card.className='badge-card'+(got?' unlocked':(isPending?' pending':' locked'));
    card.setAttribute('data-key',badgeKey);
    const star=got?'⭐':'';
    card.innerHTML=`
      <div class="badge-icon">${bt.id==='master'?u.icon:u.labIcon}<div class="frame"></div></div>
      <div class="badge-name">${star} ${bt.name}</div>
      <div class="badge-unit">${u.sem} · ${u.name}</div>
      <div class="badge-status${got?' got':(isPending?' pending':' lost')}">${got?bt.desc:(isPending?'👆 点击解锁':'🔒 未解锁')}</div>
      ${isPending?'<div class="pending-overlay">✨ 点击解锁</div>':''}
    `;

    if(isPending){
      card.onclick=function(){
        // 移除pending状态
        var p=JSON.parse(localStorage.getItem('sci_pending')||'[]');
        var idx=p.indexOf(badgeKey);
        if(idx!==-1){p.splice(idx,1);localStorage.setItem('sci_pending',JSON.stringify(p))}
        if(bt.id==='lab'){var lp=JSON.parse(localStorage.getItem('sci_lab')||'{}');lp[u.id]={done:true};localStorage.setItem('sci_lab',JSON.stringify(lp))}
        // 动画
        card.classList.remove('pending');card.classList.add('unlocked','reveal');
        card.querySelector('.pending-overlay').remove();
        card.querySelector('.badge-status').textContent=bt.desc;
        card.querySelector('.badge-status').className='badge-status got';
        card.querySelector('.badge-name').innerHTML='⭐ '+bt.name;
        sfxUnlock();
        // 烟花粒子
        var rect=card.getBoundingClientRect();
        for(var i=0;i<8;i++){
          var s=document.createElement('div');s.className='spark';
          s.style.left=(rect.left+rect.width/2)+'px';s.style.top=(rect.top+rect.height/2)+'px';
          s.style.setProperty('--dx',(Math.random()-.5)*120+'px');
          s.style.setProperty('--dy',(Math.random()-.5)*120+'px');
          s.textContent=['✨','🌟','💫','⭐'][i%4];
          document.body.appendChild(s);
          setTimeout(function(){s.remove()},800);
        }
        // 更新计数
        unlocked++;
        if(bt.id==='master')masterCount++;else labCount++;
        renderStats();
        if(unlocked>=total&&!celAll){celAll=true;sfxAllBadges();setTimeout(celAllBadges,900)}
        else if(masterCount>=8&&!celMaster){celMaster=true;sfxAllMaster();setTimeout(celAllMaster,500)}
        else if(labCount>=8&&!celLab){celLab=true;sfxAllLab();setTimeout(celAllLab,500)}
      };
    }

    grid.appendChild(card);
  });
});

// ==================== 隐藏徽章 ====================
const HIDDEN_BADGES=[
  {id:'diligent',name:'勤学徽章',icon:'📖',desc:'累计复习错题 20 道',hint:'🔍 神秘徽章之一……它藏身于「错题复习」——多去复习几次错题，它自会现身。'},
  {id:'precise',name:'精准徽章',icon:'🎯',desc:'初次挑战全部单元，错题 ≤ 8',hint:'🔍 神秘徽章之一……它考验「初次闯关」——第一次挑战每个单元时，尽量少出错。'}
];
const hiddenGot=JSON.parse(localStorage.getItem('sci_hidden')||'[]');
function isHiddenReady(id){
  if(id==='diligent')return (parseInt(localStorage.getItem('sci_review_count')||'0'))>=20;
  if(id==='precise'){
    var ft=JSON.parse(localStorage.getItem('sci_first_try')||'{}');
    if(!UNITS.every(function(u){return ft[u.id]&&ft[u.id].done}))return false;
    var tot=UNITS.reduce(function(s,u){return s+(ft[u.id]?ft[u.id].wrong:0)},0);
    return tot<=UNITS.length;
  }
  return false;
}
HIDDEN_BADGES.forEach(function(hb){
  const revealed=hiddenGot.indexOf(hb.id)!==-1;
  const ready=!revealed&&isHiddenReady(hb.id);
  if(revealed)unlocked++;
  const card=document.createElement('div');
  card.className='badge-card'+(revealed?' unlocked':(ready?' hidden hidden-ready':' hidden'));
  card.innerHTML=revealed
    ? `<div class="badge-icon">${hb.icon}<div class="frame"></div></div><div class="badge-name">⭐ ${hb.name}</div><div class="badge-unit">🎁 隐藏徽章</div><div class="badge-status got">${hb.desc}</div>`
    : `<div class="badge-icon">❓<div class="frame"></div></div><div class="badge-name hidden-name">？？？</div><div class="badge-unit">🎁 隐藏徽章</div><div class="badge-status ${ready?'pending':'lost'}">${ready?'✨ 点击解锁':'🔒 神秘徽章'}</div>`;
  if(!revealed){
    card.onclick=function(){
      if(isHiddenReady(hb.id)){
        var gh=JSON.parse(localStorage.getItem('sci_hidden')||'[]');
        if(gh.indexOf(hb.id)===-1){gh.push(hb.id);localStorage.setItem('sci_hidden',JSON.stringify(gh))}
        card.classList.remove('hidden','hidden-ready');card.classList.add('unlocked','hidden-reveal');
        card.innerHTML=`<div class="badge-icon">${hb.icon}<div class="frame"></div></div><div class="badge-name">⭐ ${hb.name}</div><div class="badge-unit">🎁 隐藏徽章</div><div class="badge-status got">${hb.desc}</div>`;
        sfxHiddenUnlock();spawnHiddenCelebration(card);
        unlocked++;renderStats();
        if(unlocked>=total&&!celAll){celAll=true;sfxAllBadges();setTimeout(celAllBadges,900)}
      }else{
        showHint(hb.hint);
      }
    };
  }
  grid.appendChild(card);
});

function spawnHiddenCelebration(card){
  var rect=card.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  var ring=document.createElement('div');ring.className='ring';
  ring.style.left=cx+'px';ring.style.top=cy+'px';
  document.body.appendChild(ring);setTimeout(function(){ring.remove()},1000);
  var fl=document.createElement('div');fl.className='flash';
  document.body.appendChild(fl);setTimeout(function(){fl.remove()},700);
  var emojis=['✨','🌟','💫','⭐','🎉','💛','🎇'];
  for(var i=0;i<24;i++){
    var s=document.createElement('div');s.className='spark';
    s.style.left=cx+'px';s.style.top=cy+'px';
    var a=(Math.PI*2*i)/24;
    var r=90+Math.random()*130;
    s.style.setProperty('--dx',Math.cos(a)*r+'px');
    s.style.setProperty('--dy',Math.sin(a)*r+'px');
    s.textContent=emojis[i%emojis.length];
    document.body.appendChild(s);
    setTimeout(function(){s.remove()},900);
  }
}
function showHint(text){showCelebrate('🔍','神秘徽章',text,'继续探索 👀')}

function renderStats(){
  document.getElementById('stats').innerHTML=
    '已获得 <strong>'+unlocked+'</strong> / '+total+' 枚徽章'+
    (unlocked>=total?' 🎉 全部集齐！':(pending.length>0?' · <span style="color:#c08020">'+pending.length+'枚待解锁</span>':''));
  if(unlocked===0&&pending.length===0)document.getElementById('stats').innerHTML+='<br><span style="font-size:12px">完成闯关模式即可解锁徽章</span>';
}
renderStats();

function showCelebrate(icon,title,desc,btnText){
  var ov=document.createElement('div');
  ov.className='cel-overlay';
  ov.style.cssText='position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;';
  ov.innerHTML='<div style="background:linear-gradient(180deg,#3a3020,#2a2010);border:3px solid #f0d050;border-radius:12px;padding:32px 28px;max-width:380px;width:90%;text-align:center;color:#f0e0c0;box-shadow:0 0 40px rgba(240,208,80,.4)">'
    +'<div style="font-size:64px;line-height:1;margin-bottom:12px">'+icon+'</div>'
    +'<div style="font-size:24px;font-weight:700;margin-bottom:10px">'+title+'</div>'
    +'<div style="font-size:14px;line-height:1.8;color:#c8b898;margin-bottom:18px">'+desc+'</div>'
    +'<button onclick="this.closest(\'.cel-overlay\').remove()" style="padding:12px 32px;border:2px solid #f0d050;background:#5a4830;color:#f0e0c0;font-size:16px;font-weight:700;cursor:pointer;border-radius:6px">'+btnText+'</button>'
    +'</div>';
  document.body.appendChild(ov);
}
function celAllMaster(){showCelebrate('🏆','闯关徽章全部集齐！','8 枚知识大师徽章全部点亮！<br>你在闯关模式中通关了所有单元。','继续加油 💪')}
function celAllLab(){showCelebrate('🔬','实验徽章全部集齐！','8 枚实验达人徽章全部点亮！<br>你在实验室里完成了所有实验。','继续加油 💪')}
function celAllBadges(){showCelebrate('👑','全部徽章集齐！','18 枚徽章全部点亮！<br>你是真正的科学闯关岛大师！','太棒了 🎉')}
// BGM开关
function toggleBGM(){
  const a=document.getElementById('bgm'),btn=document.getElementById('bgm-btn');
  if(a.paused){window.__bgmOff=false;a.play();btn.textContent='♫';btn.classList.remove('muted')}
  else{window.__bgmOff=true;a.pause();btn.textContent='♪';btn.classList.add('muted')}
}
</script>
</body>
</html>

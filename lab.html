<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>实验室 - 科学闯关岛</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','SimHei','PingFang SC',sans-serif;background:#1a1a1a;overflow:hidden;height:100vh;height:100dvh;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#2a2a28;border-bottom:2px solid #4a4840;z-index:10;position:relative;flex-wrap:wrap}
.back-btn{width:34px;height:34px;border:2px solid #5a5850;background:#3a3830;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#c8c0b0}
.unit-name{font-size:22px;font-weight:700;color:#e8d8b0;flex:1;min-width:120px}
.unit-desc{font-size:13px;color:#8a8070;width:100%}
.top-btn{padding:6px 14px;border:2px solid #5a5850;background:#3a3830;color:#c8c0b0;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.top-btn:hover{background:#4a4840;color:#e8d8b0}
.top-btn.active{background:#5a5040;border-color:#c89840;color:#e8d8b0}
.workspace{display:flex;height:calc(100vh - 64px)}
.tray{width:150px;background:#252520;border-right:2px solid #3a3830;padding:10px 8px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.tray-item{padding:18px 8px;background:#302e28;border:2px solid #4a4840;text-align:center;cursor:pointer;font-size:15px;color:#c8c0b0;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.tray-item:hover{border-color:#8a8060;background:#383630;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tray-item:active{transform:scale(.92);transition:all .08s}
.tray-item .icon{font-size:44px;display:block;margin-bottom:4px;pointer-events:none;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.tray-item:hover .icon{transform:scale(1.15)}
.bench{flex:1;position:relative;background:linear-gradient(180deg,#303028 0%,#282820 100%);overflow:hidden}
.bench-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.03) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
#bc{position:absolute;inset:0;touch-action:none}
.hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;background:rgba(0,0,0,.75);color:#a09880;font-size:15px;border-radius:6px;pointer-events:none;transition:all .3s;white-space:nowrap;z-index:6}
.hint.ok{color:#b8d8a0}.hint.warn{background:rgba(200,60,30,.7);color:#f8d8d0}
.del-hint{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);padding:3px 12px;background:rgba(0,0,0,.5);color:rgba(255,255,255,.25);font-size:11px;border-radius:4px;pointer-events:none;z-index:5}
.wire-hint{position:absolute;top:12px;right:16px;padding:8px 16px;background:rgba(0,0,0,.6);color:#c89840;font-size:16px;border-radius:4px;pointer-events:none;z-index:5}
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s,background .35s}
.modal-overlay.active{opacity:1;pointer-events:auto;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.modal{background:#2a2820;border:3px solid #6a6050;padding:24px 20px;max-width:360px;width:92%;color:#d8d0c0;transform:scale(.7) translateY(30px);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.active .modal{transform:scale(1) translateY(0)}
.modal h3{font-size:20px;margin-bottom:12px;text-align:center}
.modal p{font-size:14px;line-height:1.8;margin-bottom:16px;text-align:center}
.modal .btn{display:block;margin:0 auto;padding:10px 28px;border:2px solid #c89840;background:#5a4830;color:#e8d8b0;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.modal .btn:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(200,152,64,.3)}
@media(max-width:640px){.workspace{flex-direction:column}.tray{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px;flex-shrink:0;border-right:none;border-bottom:2px solid #3a3830}.tray-item{min-width:88px;padding:8px 4px;font-size:12px;flex-shrink:0}.tray-item .icon{font-size:24px}.bench{flex:1;min-height:0}.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);white-space:normal;font-size:12px;max-width:92%;text-align:center;padding:6px 12px}.del-hint{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);font-size:10px;white-space:normal;max-width:92%;text-align:center}}
.k-btn{position:fixed;bottom:20px;left:20px;width:44px;height:44px;border:2px solid #c89840;background:rgba(42,40,32,.9);font-size:22px;cursor:pointer;z-index:50;display:none;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(0,0,0,.3);transition:all .2s;color:#e8d8b0}
.k-btn.show{display:flex}.k-btn:hover{transform:scale(1.1);box-shadow:0 0 20px rgba(200,152,64,.4)}
</style>
</head>

<audio id="bgm" src="Spring_Wild_Horseradish_Jam.mp3" autoplay loop volume="0.18"></audio>
<script>(function(){var a=document.getElementById('bgm');var t=parseFloat(localStorage.getItem('bgm_t')||'0');if(t>0)a.currentTime=t;a.play();setInterval(function(){localStorage.setItem('bgm_t',a.currentTime)},300);window.addEventListener('beforeunload',function(){localStorage.setItem('bgm_t',a.currentTime)});})();</script>

  <button class="top-btn active" id="btn-s4a4" onclick="switchUnit('s4a4')">🔋电路</button>

  <button class="top-btn" onclick="clearBench()">🗑清空</button>
  <div class="unit-desc" id="udesc">四年级上册 · 第四单元</div>

<div class="workspace">
  <div class="tray" id="tray"></div>
  <div class="bench"><div class="bench-grid"></div><canvas id="bc"></canvas>
    <div class="wire-hint" id="wire-hint">🟡 金色连线 = 导线</div>
    <div class="del-hint" id="del-hint">🖱️ 右键删除 · 双击删除连线</div>
    <div class="hint" id="hint"></div>
  </div>
</div>
<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>
<button class="k-btn" id="k-btn" onclick="showKnowledge()" title="查看知识点">📖</button>

<script>
// ==================== 实验室定义 ====================
const LABS={
s4a4:{name:'电路实验室',desc:'四年级上册 · 第四单元',icon:'🔋',
  tray:[
    {id:'battery',icon:'🔋',label:'电池',w:240,h:140,color:'#80a860',term:[{x:.06,y:.5},{x:.94,y:.5}]},
    {id:'bulb',icon:'💡',label:'灯泡',w:168,h:192,color:'#e8d8a0',term:[{x:.5,y:.06},{x:.5,y:.94}]},
    {id:'switch',icon:'🔘',label:'开关',w:192,h:104,color:'#a0a0a0',term:[{x:.06,y:.5},{x:.94,y:.5}],sw:true},
    {id:'blackbox',icon:'📦',label:'电路暗箱',w:280,h:220,color:'#4a4a4a',term:[{x:.22,y:.18},{x:.78,y:.18},{x:.22,y:.82},{x:.78,y:.82}],bb:true},
  ]
},
s4a3:{name:'力学工坊',desc:'四年级上册 · 第三单元',icon:'⚖️',
  tray:[
    {id:'spring',label:'弹簧测力',icon:'〰️',w:320,h:210,color:'#c0c0c0',exp:'spring'},
    {id:'buoyancy',label:'浮力实验',icon:'🌊',w:340,h:200,color:'#60a0d0',exp:'buoyancy'},
    {id:'friction',label:'摩擦实验',icon:'📐',w:340,h:170,color:'#c89860',exp:'friction'},
  ]
},
s4a1:{name:'动物王国',desc:'四年级上册 · 第一单元',icon:'🦴',
  tray:[
    {id:'tiger',icon:'🐅',label:'老虎',w:80,h:55,cat:'mammal',animal:true},
    {id:'goldfish',icon:'🐟',label:'金鱼',w:80,h:55,cat:'fish',animal:true},
    {id:'sparrow',icon:'🐦',label:'麻雀',w:80,h:55,cat:'bird',animal:true},
    {id:'frog',icon:'🐸',label:'青蛙',w:80,h:55,cat:'amphibian',animal:true},
    {id:'panda',icon:'🐼',label:'大熊猫',w:80,h:55,cat:'mammal',animal:true,endangered:true},
    {id:'snake',icon:'🐍',label:'蛇',w:80,h:55,cat:'reptile',animal:true},
    {id:'eagle',icon:'🦅',label:'老鹰',w:80,h:55,cat:'bird',animal:true},
    {id:'dolphin',icon:'🐬',label:'海豚',w:80,h:55,cat:'mammal',animal:true},
    {id:'bee',icon:'🐝',label:'蜜蜂',w:80,h:55,cat:'insect',animal:true},
    {id:'shark',icon:'🦈',label:'鲨鱼',w:80,h:55,cat:'fish',animal:true},
    {id:'lizard',icon:'🦎',label:'蜥蜴',w:80,h:55,cat:'reptile',animal:true},
    {id:'penguin',icon:'🐧',label:'企鹅',w:80,h:55,cat:'bird',animal:true},
    {id:'butterfly',icon:'🦋',label:'蝴蝶',w:80,h:55,cat:'insect',animal:true},
    {id:'turtle',icon:'🐢',label:'海龟',w:80,h:55,cat:'reptile',animal:true,endangered:true},
    {id:'ladybug',icon:'🐞',label:'瓢虫',w:80,h:55,cat:'insect',animal:true},
  ]
},
s4a2:{name:'运动竞技',desc:'四年级上册 · 第二单元',icon:'🚌',
  tray:[
    {id:'reference',label:'参照物观察台',icon:'🚌',w:560,h:420,color:'#8098b0',exp:'reference'},
  ]
},
s3b1:{name:'植物乐园',desc:'三年级下册 · 第二单元',icon:'🌻',
  tray:[
    {id:'plant',label:'植物生长台',icon:'🌱',w:480,h:400,color:'#80a860',exp:'plant'},
  ]
},
s3b2:{name:'声音探秘',desc:'三年级下册 · 第三单元',icon:'🎸',
  tray:[
    {id:'string',label:'拨弦实验',icon:'🎸',w:500,h:320,color:'#c89860',exp:'string'},
    {id:'scale',label:'弹琴挑战',icon:'🎹',w:520,h:360,color:'#80a0c8',exp:'scale'},
    {id:'freq',label:'频率闯关',icon:'🔊',w:500,h:320,color:'#a080c8',exp:'freq'},
  ]
},
s3b3:{name:'材料工坊',desc:'三年级下册 · 第四单元',icon:'🔨',
  tray:[
    {id:'waterproof',label:'防水测试台',icon:'💧',w:360,h:340,color:'#6090c0',exp:'waterproof'},
    {id:'hard',label:'硬度测试台',icon:'🔪',w:360,h:340,color:'#c08050',exp:'hard'},
    {id:'flex',label:'柔韧测试台',icon:'📏',w:360,h:340,color:'#60a060',exp:'flex'},
  ]
},
s3b4:{name:'气象站',desc:'三年级下册 · 第五单元',icon:'🌡️',
  tray:[
    {id:'thermo',label:'温度计',icon:'🌡️',w:340,h:360,color:'#c87850',exp:'thermo'},
    {id:'rain',label:'雨量计',icon:'🌧️',w:340,h:360,color:'#6080b8',exp:'rain'},
    {id:'cycle',label:'水循环',icon:'💧',w:480,h:380,color:'#60a0b0',exp:'cycle'},
  ]
},
};

// 动物分类数据
const ANIMAL_CATS=[{id:'mammal',name:'哺乳类'},{id:'bird',name:'鸟类'},{id:'reptile',name:'爬行类'},{id:'amphibian',name:'两栖类'},{id:'fish',name:'鱼类'},{id:'insect',name:'昆虫类'}];
const BB_CONFIGS=[{name:'谜题1',links:[[0,1]]},{name:'谜题2',links:[[0,2]]},{name:'谜题3',links:[[0,1],[2,3]]},{name:'谜题4',links:[[0,3],[1,2]]}];
const MATERIALS={cloth:{name:'布料',icon:'🧵',wp:false,fl:true,hd:0,clr:'#c8a0a0'},plastic:{name:'塑料',icon:'🧴',wp:true,fl:true,hd:1,clr:'#a0b8d0'},paper:{name:'纸',icon:'📄',wp:false,fl:false,hd:0,clr:'#e8e0d0'},metal:{name:'金属',icon:'🔩',wp:true,fl:true,hd:4,clr:'#a0a8b0'},wood:{name:'木头',icon:'🪵',wp:false,fl:false,hd:2,clr:'#c89860'},stone:{name:'石头',icon:'🪨',wp:true,fl:false,hd:3,clr:'#9a9a9a'}};
const WP_MATS=['cloth','plastic','paper','metal'];
const FL_MATS=['wood','plastic','paper','metal'];
const HD_MATS=['wood','plastic','stone','metal'];
function getBoxRects(){const cols=3,rows=2,mob=window.innerWidth<640,bw=mob?110:230,bh=mob?92:130,gx=mob?8:20,gy=mob?8:18,tw=cols*bw+(cols-1)*gx,th=rows*bh+(rows-1)*gy,ox=(W-tw)/2,oy=Math.max(30,(H-th)/2);let r=[];for(let ri=0;ri<rows;ri++)for(let ci=0;ci<cols;ci++){const c=ANIMAL_CATS[ri*cols+ci];r.push({id:c.id,name:c.name,x:ox+ci*(bw+gx),y:oy+ri*(bh+gy),w:bw,h:bh})}return r}
function hitBox(mx,my){const boxes=getBoxRects();for(let b of boxes){if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h)return b}return null}

// ==================== 状态 ====================
const p=new URLSearchParams(location.search);
let uid=p.get('unit')||'s4a4',lab=LABS[uid];
let items=[],wires=[],sel=null,bGlow=0,wasLit=false,ks=false,mechDone=false,aniDone=false,refDone=false,plantDone=false,bbUnlocked=false,bbKs=false,kbMode=0,soundDone=false,weatherDone=false,materialsDone=false,matCaseCount=0;
let dragIdx=-1,dragOX=0,dragOY=0,dragType='move',dragSX=0,dragSY=0,dragSw=null;

// Canvas
const cv=document.getElementById('bc'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=cv.parentElement.clientWidth;H=cv.height=cv.parentElement.clientHeight}
rs();window.addEventListener('resize',rs);

// ==================== 绘制 ====================
function draw(){
  ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;
  ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=48)for(let y=0;y<H;y+=48)ctx.strokeRect(x,y,48,48);
  // 动物王国：分类盒
  if(uid==='s4a1'){const boxes=getBoxRects();let overBox=null;if(dragIdx>=0&&dragType==='animal'){const bi=items[dragIdx],t=bi.trayItem;overBox=hitBox(bi.x+t.w/2,bi.y+t.h/2)}boxes.forEach(b=>{ctx.fillStyle=b.id===overBox?.id?'rgba(120,180,80,.2)':'rgba(255,255,255,.04)';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle=b.id===overBox?.id?'#80c060':(b.placedCount>0?'rgba(120,200,80,.35)':'rgba(255,255,255,.18)');ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h);const placed=items.filter(bi=>bi.trayItem.animal&&bi.placed&&bi._boxId===b.id);b.placedCount=placed.length;ctx.fillStyle='rgba(255,255,255,.45)';ctx.font='bold 18px "Microsoft YaHei",sans-serif';ctx.textAlign='center';ctx.fillText(b.name,b.x+b.w/2,b.y+26);ctx.fillStyle='rgba(255,255,255,.1)';ctx.font='13px "Microsoft YaHei",sans-serif';ctx.fillText(placed.length>0?'已放入 '+placed.length+' 种':'将卡片拖入此处',b.x+b.w/2,b.y+b.h-12);placed.forEach((p,pi)=>{const t2=p.trayItem;ctx.fillStyle='rgba(0,0,0,.55)';const pw=Math.min(78,b.w/placed.length-4),px=b.x+4+pi*(pw+2);ctx.fillRect(px,b.y+b.h-38,pw,22);ctx.fillStyle='#fff';ctx.font='12px "Microsoft YaHei",sans-serif';ctx.fillText(t2.icon+' '+t2.label,px+pw/2,b.y+b.h-24)})})}

  items.forEach((bi,i)=>{
    const t=bi.trayItem;
    if(t.exp){drawExp(bi);return} // 力学实验由专用函数渲染
    if(t.animal){drawAnimal(bi,i);return} // 动物卡片
    if(t.bb){drawBlackbox(bi,i);return} // 电路暗箱
    // 电路组件
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(bi.x+2,bi.y+2,t.w,t.h);
    ctx.fillStyle='#3a3830';ctx.fillRect(bi.x-1,bi.y-1,t.w+2,t.h+2);
    ctx.fillStyle=t.color+'44';ctx.fillRect(bi.x,bi.y,t.w,t.h);
    ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.strokeRect(bi.x,bi.y,t.w,t.h);
    if(t.sw){ctx.fillStyle=bi.closed===false?'rgba(255,100,80,.5)':'rgba(100,255,130,.5)';ctx.fillRect(bi.x,bi.y,t.w,t.h)}
    ctx.fillStyle='#fff';ctx.font='52px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.icon,bi.x+t.w/2,bi.y+t.h/2);
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.font='bold 16px "Microsoft YaHei",sans-serif';ctx.textAlign='center';
    ctx.fillText(t.label+(t.sw?(bi.closed===false?' OFF':' ON'):''),bi.x+t.w/2,bi.y+t.h-14);
    t.term.forEach((tm,ti)=>{
      const tx=bi.x+tm.x*t.w,ty=bi.y+tm.y*t.h;
      ctx.fillStyle=(sel&&sel.i===i&&sel.ti===ti)?'#f0d050':'#c89840';ctx.beginPath();ctx.arc(tx,ty,7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#8a6830';ctx.lineWidth=1.5;ctx.stroke();
    });
  });
  // 连线
  wires.forEach(w=>{
    const fa=items[w.a.i],fb=items[w.b.i];if(!fa||!fb)return;
    const ta=fa.trayItem,tb=fb.trayItem;
    const ax=fa.x+ta.term[w.a.ti].x*ta.w,ay=fa.y+ta.term[w.a.ti].y*ta.h;
    const bx=fb.x+tb.term[w.b.ti].x*tb.w,by=fb.y+tb.term[w.b.ti].y*tb.h;
    ctx.strokeStyle='#c89840';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();
    ctx.fillStyle='#e0c860';ctx.beginPath();ctx.arc(ax,ay,3,0,Math.PI*2);ctx.fill();ctx.arc(bx,by,3,0,Math.PI*2);ctx.fill();
  });
  // 灯泡发光
  if(bGlow>0)items.forEach(bi=>{if(bi.trayItem.id!=='bulb')return;
    const cx=bi.x+bi.trayItem.w/2,cy=bi.y+bi.trayItem.h/2;
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,55);g.addColorStop(0,'rgba(255,248,200,.5)');g.addColorStop(.5,'rgba(255,240,180,.25)');g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,55,0,Math.PI*2);ctx.fill();
  });
}

  for(let i=items.length-1;i>=0;i--){const bi=items[i],t=bi.trayItem;if(mx>=bi.x&&mx<=bi.x+t.w&&my>=bi.y&&my<=bi.y+t.h){wires=wires.filter(w=>w.a.i!==i&&w.b.i!==i);wires.forEach(w=>{if(w.a.i>i)w.a.i--;if(w.b.i>i)w.b.i--});items.splice(i,1);sel=null;dragIdx=-1;dragType='move';if(uid==='s4a4')check();draw();return}}
  let best=-1,bestD=30;for(let i=wires.length-1;i>=0;i--){const w=wires[i],fa=items[w.a.i],fb=items[w.b.i];if(!fa||!fb)continue;const ta=fa.trayItem,tb=fb.trayItem;const ax=fa.x+ta.term[w.a.ti].x*ta.w,ay=fa.y+ta.term[w.a.ti].y*ta.h,bx=fb.x+tb.term[w.b.ti].x*tb.w,by=fb.y+tb.term[w.b.ti].y*tb.h;const dx=bx-ax,dy=by-ay;const t2=dx*dx+dy*dy||1;const pr=Math.max(0,Math.min(1,((mx-ax)*dx+(my-ay)*dy)/t2));const px=ax+pr*dx,py=ay+pr*dy;const d=Math.hypot(mx-px,my-py);if(d<bestD){bestD=d;best=i}}if(best>=0){wires.splice(best,1);check();draw()}
}

// ==================== 切换/清空 ====================
function renderLab(){let tt=lab.tray;if(uid==='s4a4'){tt=bbUnlocked?lab.tray.filter(t=>!t.sw):lab.tray.filter(t=>!t.bb)}document.getElementById('tray').innerHTML=tt.map(t=>`<div class="tray-item" data-id="${t.id}"><span class="icon">${t.icon}</span>${t.label}</div>`).join('');document.querySelectorAll('.top-btn[id^="btn-"]').forEach(b=>b.classList.remove('active'));const ab=document.getElementById('btn-'+uid);if(ab)ab.classList.add('active')}
function showKnowledge(){if(uid==='s4a4')showK();else if(uid==='s4a3')showMechK();else if(uid==='s4a1')showAniK();else if(uid==='s4a2')showRefK();else if(uid==='s3b1')showPlantK();else if(uid==='s3b2')showSoundK();else if(uid==='s3b4')showWeatherK();else if(uid==='s3b3')showMaterialsK()}function switchUnit(id){uid=id;lab=LABS[id];items=[];wires=[];sel=null;bGlow=0;ks=false;mechDone=false;aniDone=false;refDone=false;plantDone=false;soundDone=false;weatherDone=false;materialsDone=false;matCaseCount=0;bbUnlocked=false;bbKs=false;kbMode=0;dragType='move';const bgmEl=document.getElementById('bgm');if(id==='s3b2'){bgmEl.pause()}else if(bgmEl.paused){bgmEl.play().catch(()=>{})}document.getElementById('k-btn').classList.remove('show');renderLab();document.getElementById('uname').textContent=lab.icon+' '+lab.name;document.getElementById('udesc').textContent=lab.desc||'';document.getElementById('wire-hint').style.display=uid==='s4a4'?'block':'none';document.getElementById('del-hint').style.display='none';document.getElementById('hint').textContent=(uid==='s4a4'?'💡 点击左侧器材→点击金色端子连线':uid==='s4a2'?'💡 选择站台/公交视角→点击场景物体→判断运动还是静止':uid==='s3b2'?'💡 点击左侧实验卡片→拨弦/弹琴/听频率':'💡 点击左侧实验卡片→添加到工作台→点击卡片内按钮互动')+((uid==='s4a3'||uid==='s3b2'||uid==='s3b4'||uid==='s3b3')?' · ⚠️三个实验台都需在网格中':'');if(uid==='s4a4')check();if(uid==='s4a2')setTimeout(showGuide,400);if(uid==='s3b1')setTimeout(showPlantGuide,400);if(uid==='s3b2')setTimeout(showSoundGuide,400);if(uid==='s3b4')setTimeout(showWeatherGuide,400);if(uid==='s3b3')setTimeout(showMaterialsGuide,400);draw()}
function clearBench(){items=[];wires=[];sel=null;bGlow=0;ks=false;aniDone=false;refDone=false;plantDone=false;soundDone=false;weatherDone=false;materialsDone=false;matCaseCount=0;dragType='move';document.getElementById('del-hint').style.display='none';document.querySelectorAll('.tray-item').forEach(el=>el.style.opacity='');if(uid==='s4a4')check();draw()}

// ==================== 初始化 ====================
renderLab();switchUnit(uid); // 确保 hint 正确设置
document.getElementById('del-hint').textContent=window.innerWidth<640?'👆 长按删除元件 · 拖动看全实验台':'🖱️ 右键删除 · 双击删除连线';

function anim(){let nd=false;if(bGlow>0){bGlow=.8+.2*Math.sin(performance.now()*.005);nd=true}items.forEach(bi=>{const t=bi.trayItem;if(t.exp==='spring'){const target=(bi.weights||0)*22;bi._animV+=(target-bi._animSt)*.12;bi._animV*=.82;bi._animSt+=bi._animV;if(Math.abs(bi._animV)>.03||Math.abs(target-bi._animSt)>.2)nd=true}if(t.exp==='friction'){const target=bi._slideTarget!=null?bi._slideTarget:0;const spd=[.32,.16,.06][bi.surface||0];const prev=bi.slideX;bi.slideX+=(target-bi.slideX)*spd;if(Math.abs(bi.slideX-prev)>.1)nd=true}if(t.exp==='buoyancy')nd=true;if(t.exp==='reference'){bi._trainX=(bi._trainX||0)+0.8;if(bi._trainX>800)bi._trainX-=800;nd=true}if(t.exp==='plant'){if((bi._growT||0)<1){bi._growT=Math.min(1,(bi._growT||0)+.04);nd=true}}if(t.exp==='string'){if((bi._vibAmp||0)>0.5){bi._vibAmp*=.94;bi._vibPhase+=.45;if(bi._vibAmp<0.5)bi._vibAmp=0;nd=true}}if(t.exp==='scale'){if((bi._vibAmpNote||0)>0.5){bi._vibAmpNote*=.88;bi._vibPhase+=.6;if(bi._vibAmpNote<0.5)bi._vibAmpNote=0;nd=true}}if(t.exp==='thermo'){if(bi._heating){const nt=Math.min(100,(bi._temp||0)+0.7);if(nt!==(bi._temp||0)){bi._temp=nt;nd=true}}if(bi._cooling){const nt=Math.max(0,(bi._temp||0)-0.7);if(nt!==(bi._temp||0)){bi._temp=nt;nd=true}}const hits=bi._tempHit||[];[0,25,100].forEach(tg=>{if(Math.abs((bi._temp||0)-tg)<=2&&hits.indexOf(tg)===-1)hits.push(tg)});bi._tempHit=hits}if(t.exp==='rain'){if(bi._raining){bi._rainLevel=Math.min(40,(bi._rainLevel||0)+0.05);nd=true}}if(t.exp==='cycle'){const x=bi.x,y=bi.y,w=t.w,h=t.h,cloudY=y+80,groundY=y+230,seaDropY=y+270;if((bi._cStage||0)===1){bi._dropY=(bi._dropY!=null?bi._dropY:seaDropY)-0.9;if(bi._dropY<=cloudY){bi._cStage=2;bi._dropY=cloudY}nd=true}if((bi._cStage||0)===3){bi._dropY+=1.3;bi._dropX=(bi._dropX!=null?bi._dropX:x+w*0.28)+1.25;if(bi._dropY>=groundY){bi._cStage=4;bi._dropY=groundY;bi._dropX=x+w*0.6}nd=true}if((bi._cStage||0)===4){const tx=x+w*0.28;const dx=bi._dropX!=null?bi._dropX:x+w*0.6;bi._dropX=dx+(tx-dx)*0.06;bi._dropY=(bi._dropY!=null?bi._dropY:groundY)+(seaDropY-(bi._dropY!=null?bi._dropY:groundY))*0.06;if(Math.abs(bi._dropX-tx)<3){bi._cStage=0;bi._cycleDone=true;bi._dropY=seaDropY}nd=true}}if(t.exp==='waterproof'){const drops=bi._wpDrops||[];drops.forEach(d=>{d.t+=0.04;if(d.phase==='fall'&&d.t>=1){d.phase='react';d.t=0;if(!bi._wpTested)bi._wpTested={};bi._wpTested[WP_MATS[d.matIdx]]=true;const nm=MATERIALS[WP_MATS[d.matIdx]].name;hint(d.wp?'✅ '+nm+'防水——水珠滚走了！':'💧 '+nm+'吸水——水渗透进去了！',d.wp?'ok':'')}if(d.phase==='react'&&d.t>=1){d.done=true}});bi._wpDrops=drops.filter(d=>!d.done);if(bi._wpDrops.length>0)nd=true}if(t.exp==='hard'){if(bi._scratch){bi._scratch.t+=0.05;if(bi._scratch.t>=1)bi._scratch=null;nd=true}}if(t.animal&&!bi.placed&&dragIdx===-1){bi.x+=(bi._ox-bi.x)*.15;bi.y+=(bi._oy-bi.y)*.15;if(Math.abs(bi._ox-bi.x)>.3||Math.abs(bi._oy-bi.y)>.3)nd=true}if(t.animal&&bi._shakeV&&Math.abs(bi._shakeV)>.1){bi._shakeX+=bi._shakeV;bi._shakeV*=-.65;if(Math.abs(bi._shakeV)<.2){bi._shakeV=0;bi._shakeX=0;bi.x=bi._ox;bi.y=bi._oy}nd=true}});if(uid==='s4a3'&&!mechDone){const expItems=items.filter(bi=>bi.trayItem.exp);if(expItems.length>=3&&expItems.every(bi=>isExpDone(bi))){if(!mechDone){mechDone=true;sfxMech();queueLabBadge(uid);setTimeout(showMechK,600)}}}if(uid==='s4a1'&&!aniDone){const cards=items.filter(bi=>bi.trayItem.animal);const total=lab.tray.filter(t=>t.animal).length;if(cards.length>=total&&cards.every(bi=>bi.placed)){aniDone=true;sfxMech();queueLabBadge(uid);setTimeout(showAniK,600)}}if(uid==='s4a2'&&!refDone){const ref=items.find(bi=>bi.trayItem.exp==='reference');if(ref&&isRefDone(ref)){refDone=true;sfxMech();queueLabBadge(uid);setTimeout(showRefK,600)}}if(uid==='s3b1'&&!plantDone){const pl=items.find(bi=>bi.trayItem.exp==='plant');if(pl&&isPlantDone(pl)){plantDone=true;sfxMech();queueLabBadge(uid);setTimeout(showPlantK,600)}}if(uid==='s3b2'&&!soundDone){const st=items.find(bi=>bi.trayItem.exp==='string'),sc=items.find(bi=>bi.trayItem.exp==='scale'),fr=items.find(bi=>bi.trayItem.exp==='freq');if(st&&sc&&fr&&(st._strLens||[]).length>=3&&sc._twinkleDone&&(fr._freqLvl||0)>=6){soundDone=true;sfxMech();queueLabBadge(uid);setTimeout(showSoundK,600)}}if(uid==='s3b4'&&!weatherDone){const th=items.find(bi=>bi.trayItem.exp==='thermo'),rn=items.find(bi=>bi.trayItem.exp==='rain'),cy=items.find(bi=>bi.trayItem.exp==='cycle');if(th&&rn&&cy&&isExpDone(th)&&isExpDone(rn)&&isExpDone(cy)){weatherDone=true;sfxMech();queueLabBadge(uid);setTimeout(showWeatherK,600)}}if(uid==='s3b3'){const wp=items.find(bi=>bi.trayItem.exp==='waterproof'),fl=items.find(bi=>bi.trayItem.exp==='flex'),hd=items.find(bi=>bi.trayItem.exp==='hard');if(wp&&isExpDone(wp)&&!wp._caseShown){wp._caseShown=true;matCaseCount++;sfxMech();const last=matCaseCount>=3;setTimeout(function(){showWpCaseK(last)},400)}if(fl&&isExpDone(fl)&&!fl._caseShown){fl._caseShown=true;matCaseCount++;sfxMech();const last=matCaseCount>=3;setTimeout(function(){showFlCaseK(last)},400)}if(hd&&isExpDone(hd)&&!hd._caseShown){hd._caseShown=true;matCaseCount++;sfxMech();const last=matCaseCount>=3;setTimeout(function(){showHdCaseK(last)},400)}if(wp&&fl&&hd&&isExpDone(wp)&&isExpDone(fl)&&isExpDone(hd)&&!materialsDone){materialsDone=true;queueLabBadge(uid)}}if(nd)draw();requestAnimationFrame(anim)}
requestAnimationFrame(anim);
</script>

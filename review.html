<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>错题复习 - 科学闯关岛</title>
<style>
@font-face{font-family:'PxFont';src:url('JinzisheBianzheng-Regular.ttf') format('truetype');}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft YaHei','SimHei','PingFang SC',sans-serif;background:#fef9f0;min-height:100vh;color:#4a3020;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fffdf6;border-bottom:3px solid #c8b898;position:sticky;top:0;z-index:10}
.back-btn{width:40px;height:40px;border:2px solid #c8b898;background:#fdf6ed;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 rgba(120,90,50,.12);color:#4a3020}
.unit-info{flex:1}.unit-name{font-size:22px;font-weight:700}.unit-desc{font-size:13px;color:#8a7060}
.stats{padding:14px 16px;text-align:center;font-size:14px;color:#8a7060;background:#fdf6ed;border-bottom:2px solid rgba(0,0,0,.04)}
.stats strong{color:#d4a020;font-size:20px}
.main{max-width:700px;margin:0 auto;padding:16px}
/* 题目 */
.quiz{background:#e8e0d0;border:3px solid #b0a080;padding:20px;margin-bottom:16px;box-shadow:3px 3px 0 rgba(80,50,20,.15);transition:background .6s,border-color .6s}
.quiz.solved{background:#f0f8e8!important;border-color:#90c060!important}
.quiz-header{display:flex;justify-content:space-between;margin-bottom:10px;font-size:13px;color:#8a7060}
.quiz-q{font-size:18px;font-weight:700;margin-bottom:14px;line-height:1.6}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:12px 16px;border:2px solid #d8c8a8;background:#fdf6ed;font-size:16px;cursor:pointer;text-align:left;font-family:inherit;color:#4a3020;transition:all .1s}
.quiz-opt:hover{background:#fef5e0;border-color:#c8a860}
.quiz-opt.chosen{pointer-events:none}
.quiz-opt.correct{background:#c8e8b0!important;border-color:#78a848!important;color:#386020!important}
.quiz-opt.wrong{background:#f0c8b8!important;border-color:#c87858!important;color:#803020!important}
.feedback{padding:12px 14px;margin-top:12px;font-size:15px;font-weight:700;display:none}
.fb-ok{display:block;background:#e0f0d0;border:2px solid #90c060;color:#407020}
.fb-no{display:block;background:#f8e0d0;border:2px solid #d89870;color:#803020}
.next-btn{display:none;margin-top:12px;text-align:center}
.next-btn.show{display:block}
.btn{padding:12px 28px;border:2px solid #c8b898;background:#e0b860;color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:2px 2px 0 rgba(120,90,50,.15);transition:all .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 rgba(120,90,50,.2)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(120,90,50,.15)}
.btn.secondary{background:#fdf6ed;color:#4a3020}
/* 空状态 */
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:80px;margin-bottom:16px}
.empty-title{font-size:28px;font-weight:700;margin-bottom:8px}
.empty-text{font-size:18px;color:#8a7060;margin-bottom:24px;line-height:2}
.level-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;margin-left:8px}
.level-badge.l0{background:#f8e0d0;color:#c05030}
.level-badge.l1{background:#fef5e0;color:#c08030}
.level-badge.l2{background:#e8f0d8;color:#608030}
.tabs{display:flex;gap:8px;padding:12px 16px;background:#fffdf6;border-bottom:2px solid rgba(0,0,0,.04)}
.tab{padding:8px 16px;border:2px solid #d8c8a8;background:#fdf6ed;font-size:15px;font-weight:700;cursor:pointer;border-radius:6px;color:#4a3020;font-family:inherit}
.tab.active{background:#e0b860;color:#fff;border-color:#c8a050}
.book-item{background:#fffdf8;border:2px solid #e0d8c8;padding:16px;margin-bottom:12px;border-radius:6px;box-shadow:2px 2px 0 rgba(120,90,50,.08)}
.book-unit{font-size:12px;color:#b09870;margin-bottom:4px}
.book-item .bq{font-size:16px;font-weight:700;margin-bottom:8px;line-height:1.6}
.book-item .ba{font-size:14px;color:#386020;margin-bottom:6px;font-weight:700}
.book-item .be{font-size:13px;color:#8a7060;line-height:1.7;background:#f8f0e0;padding:8px 10px;border-radius:4px}
</style>
</head>
<body>
<audio id="bgm" src="Spring_Wild_Horseradish_Jam.mp3" autoplay loop volume="0.18"></audio>
<script>(function(){var a=document.getElementById('bgm');function sv(){try{localStorage.setItem('bgm_t',String(a.currentTime||0));localStorage.setItem('bgm_ts',String(Date.now()))}catch(e){}}function sk(){var t=parseFloat(localStorage.getItem('bgm_t')||'0'),ts=parseFloat(localStorage.getItem('bgm_ts')||'0'),d=a.duration||0;if(t>0&&ts>0&&d>0){try{a.currentTime=(t+(Date.now()-ts)/1000)%d}catch(e){}}}function pl(){sk();var p=a.play();if(p&&p.catch)p.catch(function(){})}pl();if(a.readyState<1)a.addEventListener('loadedmetadata',pl,{once:true});setInterval(sv,250);window.addEventListener('pagehide',sv);window.addEventListener('beforeunload',sv);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')sv()});['pointerdown','touchstart','click'].forEach(function(ev){document.addEventListener(ev,function(){if(window.__bgmOff)return;if(a.paused)pl()},{passive:true})})})();</script>
<div class="top">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="unit-info"><div class="unit-name">📝 错题复习</div><div class="unit-desc">间隔重复 · 科学记忆</div></div>
</div>
<div class="tabs" id="tabs">
  <button class="tab active" data-tab="review">📝 待复习</button>
  <button class="tab" data-tab="wrong">📕 错题本</button>
  <button class="tab" data-tab="good">⭐ 好题本</button>
</div>
<div class="stats" id="stats"></div>
<div class="main" id="main"></div>

<script>
// ==================== 音效 ====================
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type,vol,delay){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,AC.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+delay+dur);
  o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur);
}
function sfxCorrect(){AC.resume();playTone(660,.1,'square',.1,0);playTone(880,.15,'square',.1,.08)}
function sfxWrong(){AC.resume();for(var i=0;i<4;i++)playTone(400-i*100,.08,'square',.1,i*.06)}

// ==================== SM-2 间隔复习 ====================
const INTERVALS=[1,3,7,14]; // 天数：1天后→3天后→7天后→14天后→毕业

function getDueQuestions(){
  const all=JSON.parse(localStorage.getItem('sci_review')||'[]');
  const today=new Date().toDateString();
  return all.filter(q=>new Date(q.next)<=new Date(today));
}

function updateReviewItem(item,correct){
  if(correct){
    item.lvl++;
    if(item.lvl>=INTERVALS.length){
      // 毕业——从队列中移除
      return 'graduate';
    }
    const days=INTERVALS[item.lvl];
    const d=new Date();d.setDate(d.getDate()+days);
    item.next=d.toDateString();
    return 'promote';
  }else{
    item.lvl=0;
    item.next=new Date().toDateString(); // 今天继续复习
    return 'reset';
  }
}

function saveReviewQueue(items){
  const all=JSON.parse(localStorage.getItem('sci_review')||'[]');
  // 更新修改过的项，移除毕业的项，保留未修改的项
  const updatedIds=new Set(items.map(q=>q.q+'-'+q.uid+'-'+q.t));
  const rest=all.filter(q=>!updatedIds.has(q.q+'-'+q.uid+'-'+q.t));
  const result=[...rest,...items.filter(q=>q.lvl<INTERVALS.length)];
  localStorage.setItem('sci_review',JSON.stringify(result));
}

// ==================== 单元名称 ====================
const UNAMES={s4a1:'动物王国',s4a2:'运动竞技',s4a3:'力学工坊',s4a4:'电路实验室',s3b1:'植物乐园',s3b2:'声音探秘',s3b3:'材料工坊',s3b4:'气象站'};

// ==================== 渲染 ====================
const main=document.getElementById('main');

function updateStats(){
  const dueQs=getDueQuestions();
  const wb=JSON.parse(localStorage.getItem('sci_wrongbook')||'[]');
  const gd=JSON.parse(localStorage.getItem('sci_good')||'[]');
  document.getElementById('stats').innerHTML=
    '待复习 <strong>'+dueQs.length+'</strong> 题 · 错题本 <strong>'+wb.length+'</strong> 题 · 好题本 <strong>'+gd.length+'</strong> 题';
}

function renderReview(){
  updateStats();
  const dueQs=getDueQuestions();
  const allQs=JSON.parse(localStorage.getItem('sci_review')||'[]');
  if(dueQs.length===0){
    var prog=JSON.parse(localStorage.getItem('sci_prog')||'{}');
    var hasAnswered=false;
    for(var k in prog){if(prog[k]&&(prog[k].c>0||prog[k].s>0)){hasAnswered=true;break}}
    if(!hasAnswered){
      main.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">还没有错题记录</div><div class="empty-text">错题本里空空如也——说明你还没开始答题呢！<br>去闯关模式做题吧，答错的题目会自动加入复习队列。<br>连续答对3次同一道题，它就能从这里"毕业"。</div><a class="btn" href="index.html">🏠 回首页</a></div>`;
    }else if(allQs.length===0){
      main.innerHTML=`<div class="empty"><div class="empty-icon">🏆</div><div class="empty-title">太厉害了，全部正确！</div><div class="empty-text">你答过的所有题目都是对的，一道错题都没有！<br>继续保持这个状态，你就是科学小达人～<br><br>去闯关模式挑战更多题目吧。</div><a class="btn" href="index.html">🏠 回首页</a></div>`;
    }else{
      main.innerHTML=`<div class="empty"><div class="empty-icon">🎉</div><div class="empty-title">今天没有待复习的错题！</div><div class="empty-text">所有错题都已按计划复习完毕。<br>做错的题目会在1天后自动出现在复习队列中，<br>连续答对3次即可"毕业"。<br><br>去闯关模式做新题，答错的题会自动加入复习队列。</div><a class="btn" href="index.html">🏠 回首页</a></div>`;
    }
    return;
  }
  let qi=0,results=[];
  showQ();

  function showQ(){
    if(qi>=dueQs.length){showComplete();return}
    const q=dueQs[qi];
    main.innerHTML=`
      <div class="quiz">
        <div class="quiz-header">
          <span>${UNAMES[q.uid]||''}</span>
          <span>第${qi+1}/${dueQs.length}题 · <span class="level-badge l${q.lvl}">Lv.${q.lvl}</span></span>
        </div>
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts" id="opts">${q.o.map((o,i)=>`<button class="quiz-opt" data-idx="${i}">${'ABCD'[i]}. ${o}</button>`).join('')}</div>
        <div class="feedback" id="fb"></div>
        <div class="next-btn" id="next"><button class="btn">下一题 →</button></div>
      </div>
    `;
    const btns=document.querySelectorAll('.quiz-opt');
    const fb=document.getElementById('fb');
    btns.forEach(b=>{b.onclick=function(){
      btns.forEach(bb=>bb.classList.add('chosen'));
      const idx=parseInt(this.dataset.idx);
      if(idx===q.a){this.classList.add('correct');fb.className='feedback fb-ok';fb.innerHTML='✅ 正确！'+(q.e?'<br><span style="font-size:13px;font-weight:400;margin-top:4px;display:inline-block">📖 '+q.e+'</span>':'');sfxCorrect();document.querySelector('.quiz').classList.add('solved');var r=updateReviewItem(q,true);results.push({item:q,result:'correct',action:r})}else{this.classList.add('wrong');btns[q.a].classList.add('correct');fb.className='feedback fb-no';fb.innerHTML='❌ 正确答案是 '+String.fromCharCode(65+q.a)+(q.e?'<br><span style="font-size:13px;font-weight:400;margin-top:4px;display:inline-block">📖 '+q.e+'</span>':'');sfxWrong();var r=updateReviewItem(q,false);results.push({item:q,result:'wrong',action:r})}
      document.getElementById('next').className='next-btn show';
    }});
    document.getElementById('next').querySelector('button').onclick=()=>{qi++;showQ()};
  }

  function showComplete(){
    saveReviewQueue(dueQs);
    const correct=results.filter(r=>r.result==='correct').length;
    const graduates=results.filter(r=>r.action==='graduate').length;
    const prevGrad=parseInt(localStorage.getItem('sci_review_graduate')||'0');
    localStorage.setItem('sci_review_graduate',prevGrad+graduates);
    const prevCount=parseInt(localStorage.getItem('sci_review_count')||'0');
    localStorage.setItem('sci_review_count',prevCount+results.length);

    main.innerHTML=`
      <div style="text-align:center;padding:40px 20px">
        <div style="font-size:56px;margin-bottom:12px">📝</div>
        <div style="font-size:24px;font-weight:700;margin-bottom:8px">复习完成！</div>
        <div style="font-size:15px;color:#8a7060;margin-bottom:8px">答对 ${correct}/${results.length} 题</div>
        ${graduates>0?`<div style="font-size:14px;color:#608030;margin-bottom:12px">🎓 ${graduates} 题已毕业！</div>`:''}
        <div style="font-size:13px;color:#a09080;margin-bottom:20px;line-height:1.8">
          ${results.map(r=>`${r.result==='correct'?'✅':'❌'} ${r.item.q.slice(0,30)}... → ${r.action==='graduate'?'🎓毕业':r.action==='promote'?'⬆升级':'🔄重来'}`).join('<br>')}
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <a class="btn" href="review.html">🔄 再检查一遍</a>
          <a class="btn secondary" href="index.html">🏠 回首页</a>
        </div>
      </div>`;
  }
}

function renderWrongbook(){
  updateStats();
  const wb=JSON.parse(localStorage.getItem('sci_wrongbook')||'[]');
  if(wb.length===0){
    main.innerHTML='<div class="empty"><div class="empty-icon">📕</div><div class="empty-title">错题本是空的</div><div class="empty-text">还没有答错的题目。<br>去闯关模式做题，答错的题会自动进入错题本，<br>并且永远不会被移除。</div><a class="btn" href="index.html">🏠 回首页</a></div>';
    return;
  }
  main.innerHTML='<div style="max-width:700px;margin:0 auto;padding:16px">'+wb.map((q,i)=>{
    const uname=UNAMES[q.uid]||'';
    return '<div class="book-item"><div class="book-unit">'+uname+' · 第'+(i+1)+'题</div><div class="bq">'+q.q+'</div><div class="ba">✅ '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</div>'+(q.e?'<div class="be">📖 '+q.e+'</div>':'')+'</div>';
  }).join('')+'</div>';
}

function renderGoodbook(){
  updateStats();
  const gd=JSON.parse(localStorage.getItem('sci_good')||'[]');
  if(gd.length===0){
    main.innerHTML='<div class="empty"><div class="empty-icon">⭐</div><div class="empty-title">好题本是空的</div><div class="empty-text">在闯关模式做题时，觉得题目不错就点 ⭐ 收藏，<br>它会出现在这里，方便你以后回顾。</div><a class="btn" href="index.html">🏠 回首页</a></div>';
    return;
  }
  main.innerHTML='<div style="max-width:700px;margin:0 auto;padding:16px">'+gd.map((q,i)=>{
    const uname=UNAMES[q.uid]||'';
    return '<div class="book-item"><div class="book-unit">'+uname+' · 第'+(i+1)+'题</div><div class="bq">'+q.q+'</div><div class="ba">✅ '+String.fromCharCode(65+q.a)+'. '+q.o[q.a]+'</div>'+(q.e?'<div class="be">📖 '+q.e+'</div>':'')+'</div>';
  }).join('')+'</div>';
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick=function(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    this.classList.add('active');
    var t=this.dataset.tab;
    if(t==='review')renderReview();
    else if(t==='wrong')renderWrongbook();
    else renderGoodbook();
  };
});

renderReview();
</script>
</body>
</html>
